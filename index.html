<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rap Star">
<meta name="theme-color" content="#23272c">
<link rel="apple-touch-icon" href="icon.png">
<title>Rap Star Sim</title>
<style>
  :root {
    --bg: #23272c;
    --panel: #40464d;
    --panel2: #4b5159;
    --bar: #5c636b;
    --pill: #e6e6e6;
    --pill-txt: #1d2125;
    --txt: #f2f3f4;
    --muted: #7d848c;
    --orange: #e9963f;
    --green: #76a477;
    --salmon: #ea7a6b;
    --teal: #7f9ea6;
    --olive: #a59b5e;
    --pink: #c9a3c4;
    --cash: #93c493;
    --energy: #ef5b4b;
    --gap: 0px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; }

  #app { max-width: 480px; margin: 0 auto; min-height: 100%; padding: calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 96px); }
  #app.push { padding-bottom: calc(env(safe-area-inset-bottom) + 30px); }

  /* ---------- top bar ---------- */
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-bottom: 14px; }
  .top .money { font-size: 14px; font-weight: 700; color: var(--cash); line-height: 1.15; white-space: nowrap; }
  .top .money .en { color: var(--energy); }
  .top .date { text-align: center; font-size: 12px; font-weight: 800; line-height: 1.15; }
  .top .date small { display: block; font-size: 9px; font-weight: 700; }
  .endweek { justify-self: end; height: 36px; padding: 0 22px; border-radius: 18px; background: var(--green); color: #1c2a1d; font-size: 14px; font-weight: 800; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
  .bolt { color: var(--energy); }

  /* ---------- titles ---------- */
  .title { font-size: 40px; font-weight: 900; letter-spacing: -.5px; margin: 6px 0 14px; line-height: 1; text-transform: uppercase; }
  .title .dim { color: #565d65; }
  .ptitle { display: flex; align-items: center; gap: 10px; margin: 4px 0 6px; min-height: 48px; }
  .ptitle .back { width: 30px; height: 40px; display: grid; place-items: center; flex: none; }
  .ptitle .back svg { width: 12px; height: 20px; }
  .ptitle .en { font-size: 15px; font-weight: 700; color: var(--energy); flex: none; }
  .ptitle h1 { flex: 1; text-align: right; margin: 0; font-size: 36px; font-weight: 900; letter-spacing: -.5px; line-height: 1; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptitle h1.norm { text-transform: none; }
  .sub { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; text-align: center; margin: 14px 0 6px; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.4; }

  /* ---------- pills ---------- */
  .pill { display: block; width: 100%; height: 44px; border-radius: 22px; background: var(--pill); color: var(--pill-txt); font-size: 14px; font-weight: 800; text-transform: uppercase; box-shadow: inset 0 -3px 0 rgba(0,0,0,.16); margin-bottom: 9px; }
  .pill .cnt { color: var(--muted); font-weight: 700; }
  .pill:disabled { opacity: .45; }
  .chip { height: 32px; padding: 0 18px; border-radius: 16px; font-size: 13px; font-weight: 800; text-transform: uppercase; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); color: #222; }
  .c-orange { background: var(--orange); } .c-green { background: var(--green); } .c-salmon { background: var(--salmon); }
  .c-teal { background: var(--teal); } .c-olive { background: var(--olive); } .c-pink { background: var(--pink); } .c-gray { background: var(--pill); }
  .big-btn { display: block; width: 100%; height: 46px; border-radius: 23px; font-size: 15px; font-weight: 800; text-transform: uppercase; color: #1d2125; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); margin: 10px 0 8px; }
  .big-btn:disabled { opacity: .45; }
  .row2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 12px 0; }

  /* ---------- home ---------- */
  .fame { position: relative; height: 40px; border-radius: 20px; background: var(--salmon); display: flex; align-items: center; padding: 0 12px 0 20px; gap: 14px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .fame b { font-size: 14px; font-weight: 800; color: #3a1a15; white-space: nowrap; }
  .fame .track { flex: 1; height: 20px; border-radius: 10px; background: rgba(255,255,255,.35); overflow: hidden; }
  .fame .track i { display: block; height: 100%; background: #f1f1f1; border-radius: 10px; }
  .platforms { display: flex; justify-content: space-between; padding: 22px 10px 16px; border-bottom: 1px solid #3a4047; }
  .plat { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; transition: transform .18s cubic-bezier(.3,.7,.4,1.4); }
  .plat:active { transform: scale(.35); transition-duration: .08s; }

  /* ---------- platform pages (slide up over the game) ---------- */
  .pf { position: fixed; inset: 0; bottom: calc(-1 * var(--gap)); z-index: 35; overflow-y: auto; -webkit-overflow-scrolling: touch;
    transform: translateY(100%); transition: transform .42s cubic-bezier(.2,.9,.25,1); }
  .pf.open { transform: none; }
  .pf .wrap { max-width: 480px; margin: 0 auto; padding-bottom: calc(env(safe-area-inset-bottom) + 30px + var(--gap)); }
  .pf .banner { position: relative; height: 300px; background-size: cover; background-position: center; }
  .pf .cam { position: absolute; right: 14px; bottom: 14px; width: 36px; height: 36px; border-radius: 50%; background: rgba(60,60,60,.75); display: grid; place-items: center; }
  .pf .cam svg { width: 20px; height: 20px; }
  .pf .down { position: absolute; left: 14px; top: calc(env(safe-area-inset-top) + 8px); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; z-index: 2; }
  .pf .down svg { width: 14px; height: 9px; }

  .pf.sp { background: #000; color: #fff; }
  .sp .meta { display: flex; justify-content: space-between; padding: 12px 20px 8px; font-size: 11px; color: #b3b3b3; }
  .sp .ctrl { display: flex; align-items: center; gap: 14px; padding: 0 20px; }
  .sp .ava { width: 28px; height: 42px; border: 2px solid #b3b3b3; border-radius: 6px; }
  .sp .follow { height: 34px; padding: 0 22px; border-radius: 17px; border: 1px solid #8a8a8a; font-size: 14px; font-weight: 700; }
  .sp .shuffle { margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; }
  .sp .play { width: 54px; height: 54px; border-radius: 50%; background: #1ed760; display: grid; place-items: center; }
  .sp .play svg { width: 22px; height: 22px; }
  .sp .tabsx { display: flex; gap: 30px; padding: 14px 20px 0; border-bottom: 1px solid #222; }
  .sp .tabsx button { font-size: 15px; color: #a7a7a7; padding-bottom: 8px; border-bottom: 3px solid transparent; }
  .sp .tabsx button.on { color: #fff; border-color: #1ed760; }
  .sp h3 { display: flex; justify-content: space-between; align-items: center; margin: 22px 20px 10px; font-size: 21px; font-weight: 700; }
  .sp .tg { width: 48px; height: 28px; border-radius: 14px; background: #444; position: relative; transition: background .2s; }
  .sp .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .sp .tg.on { background: #1ed760; } .sp .tg.on::after { transform: translateX(20px); }
  .sp .tr { display: flex; align-items: center; gap: 12px; padding: 6px 20px; }
  .sp .tr .n { width: 16px; font-size: 14px; color: #fff; text-align: center; }
  .sp .tr .c { width: 48px; height: 48px; flex: none; background-size: cover; background-position: center; }
  .sp .tr .t { flex: 1; min-width: 0; }
  .sp .tr .t b { display: block; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp .tr .t small { font-size: 13px; color: #a7a7a7; }
  .sp .tr .dots { color: #a7a7a7; font-size: 18px; letter-spacing: 1px; }
  .sp .tr.playing .t b { color: #1ed760; }
  .sp .empty { padding: 10px 20px; color: #a7a7a7; font-size: 14px; }

  .pf.am { background: #fff; color: #000; }
  .am .banner .name { position: absolute; left: 16px; bottom: 14px; color: #fff; font-size: 34px; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
  .am .down { background: rgba(255,255,255,.25); }
  .am .feat { display: flex; gap: 12px; align-items: center; padding: 16px; }
  .am .feat .c { width: 74px; height: 74px; border-radius: 6px; background-size: cover; background-position: center; flex: none; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .am .feat small { font-size: 10px; font-weight: 600; color: #8a8a8e; display: block; }
  .am .feat b { font-size: 15px; font-weight: 500; display: block; margin: 2px 0 6px; }
  .am .feat .pillr { display: inline-block; font-size: 11px; color: #fa2d48; background: #f2f2f7; border-radius: 12px; padding: 4px 12px; font-weight: 600; }
  .am h3 { margin: 10px 16px 6px; font-size: 21px; font-weight: 700; }
  .am h3 span { color: #8a8a8e; font-weight: 400; }
  .am .tr { padding: 8px 16px; border-bottom: .5px solid #e5e5ea; margin-left: 0; }
  .am .tr b { display: block; font-size: 15px; font-weight: 500; }
  .am .tr small { font-size: 12px; color: #8a8a8e; }
  .am .albums { display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 10px; }
  .am .albums div { flex: none; width: 150px; }
  .am .albums i { display: block; width: 150px; height: 150px; border-radius: 8px; background-size: cover; background-position: center; }
  .am .albums b { display: block; font-size: 13px; font-weight: 500; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .am .albums small { font-size: 12px; color: #8a8a8e; }

  .pf.bs { background: #0f0f12; color: #fff; }
  .bs .head { padding: 16px 18px; }
  .bs .head b { font-size: 26px; font-weight: 800; display: block; }
  .bs .head small { color: #aaa; font-size: 13px; }
  .bs .vid { display: flex; gap: 12px; padding: 8px 18px; }
  .bs .vid i { width: 150px; height: 84px; border-radius: 8px; flex: none; background-size: cover; background-position: center; position: relative; }
  .bs .vid i::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 22px; color: rgba(255,255,255,.85); }
  .bs .vid b { display: block; font-size: 15px; font-weight: 600; }
  .bs .vid small { font-size: 12px; color: #aaa; }
  .plat svg { width: 28px; height: 28px; }
  .listeners { text-align: center; margin: 16px 0 4px; font-size: 19px; font-weight: 700; }
  .listeners .plus { color: var(--cash); font-weight: 600; }
  .listeners small { display: block; font-size: 11px; letter-spacing: 2px; color: #c9ccd0; font-weight: 600; margin-top: 3px; }
  .chart { position: relative; height: 210px; margin: 6px 0 18px; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .chart .yl { position: absolute; left: 0; font-size: 10px; color: #c9ccd0; font-weight: 600; }

  /* ---------- talent ---------- */
  .trow { display: flex; align-items: stretch; height: 70px; border-radius: 35px; background: var(--panel); margin-bottom: 12px; overflow: hidden; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .trow .lv { width: 98px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .trow .lv b { font-size: 38px; font-weight: 900; line-height: 1; }
  .trow .lv small { font-size: 11px; color: #c9ccd0; font-weight: 700; margin-top: 2px; }
  .trow .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding-right: 14px; }
  .trow .mid span { font-size: 10px; letter-spacing: 2.5px; color: #c9ccd0; font-weight: 600; text-transform: uppercase; }
  .trow .mid i { display: block; height: 17px; border-radius: 9px; background: var(--bar); overflow: hidden; }
  .trow .mid i em { display: block; height: 100%; background: #ececec; border-radius: 9px; }
  .trow .up { width: 64px; flex: none; background: var(--green); display: grid; place-items: center; }
  .trow .up.orange { background: var(--orange); }
  .trow .up svg { width: 24px; height: 24px; }
  .trow .up:disabled { background: #5a6168; }
  .trow.locked { opacity: .55; }
  .section { display: flex; align-items: center; gap: 10px; font-size: 34px; font-weight: 900; margin: 26px 0 14px; text-transform: uppercase; }
  .section svg { width: 22px; height: 26px; }

  /* ---------- music ---------- */
  .listhead { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 6px; }
  .listhead span { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
  .toplist { margin: 0 0 22px; min-height: 76px; }
  .toplist div { font-size: 19px; font-weight: 800; line-height: 1.4; }
  .toplist div small { font-size: 11px; color: var(--muted); font-weight: 700; margin-right: 4px; }
  .toplist div em { font-style: normal; color: #5e656d; font-weight: 700; }
  .toplist .empty { font-size: 14px; color: var(--muted); font-weight: 500; }

  .srow { display: flex; align-items: center; height: 58px; border-radius: 14px; background: var(--panel); margin-bottom: 9px; overflow: hidden; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); width: 100%; text-align: left; }
  .srow .info { flex: 1; min-width: 0; padding: 0 14px; }
  .srow .info b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .info small { display: block; font-size: 11px; color: #c0c4c9; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .q { width: 58px; height: 100%; background: var(--orange); color: #2a1a08; display: grid; place-items: center; font-size: 26px; font-weight: 900; flex: none; }
  .srow .q.me { background: var(--salmon); }
  .srow .cov { width: 42px; height: 42px; border-radius: 6px; margin-left: 8px; flex: none; background-size: cover; background-position: center; }
  .srow.hl { outline: 2px solid var(--orange); }

  /* ---------- forms ---------- */
  .inp { display: flex; height: 48px; border-radius: 24px; background: var(--panel); overflow: hidden; }
  .inp input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--txt); padding: 0 20px; font-size: 16px; }
  .inp input::placeholder { color: #9aa0a6; }
  .inp button { width: 54px; background: var(--green); display: grid; place-items: center; }
  .inp button svg { width: 16px; height: 16px; }
  .sel { display: flex; align-items: center; justify-content: space-between; margin: 2px 0; }
  .sel button { width: 56px; height: 44px; display: grid; place-items: center; }
  .sel button svg { width: 26px; height: 20px; }
  .sel .val { flex: 1; text-align: center; }
  .sel .val b { display: block; font-size: 17px; font-weight: 800; text-transform: uppercase; }
  .sel .val span { font-size: 15px; font-weight: 600; }
  .sel .val .sk { color: var(--cash); }
  .sel .val .sk.low { color: var(--salmon); }
  .total { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px; }
  .total span { font-size: 11px; letter-spacing: 2px; color: #c9ccd0; font-weight: 600; }
  .total b { font-size: 28px; font-weight: 600; color: var(--salmon); }
  .avail { text-align: center; font-size: 10px; color: #c9ccd0; font-weight: 600; text-transform: uppercase; }
  .genre .chip { width: 120px; height: 34px; opacity: .45; }
  .genre .chip.on { opacity: 1; }

  .covers { display: flex; gap: 8px; justify-content: center; margin: 10px 0 20px; }
  .covers button { width: 72px; height: 72px; border-radius: 4px; background-size: cover; background-position: center; }
  .covers button.on { outline: 3px solid var(--green); outline-offset: 2px; }
  .bigcover { width: 110px; height: 110px; margin: 6px auto 10px; border-radius: 4px; background-size: cover; background-position: center; box-shadow: 0 8px 24px rgba(0,0,0,.4); }

  /* ---------- song detail ---------- */
  .sd-cov { width: 64px; height: 64px; border-radius: 6px; background-size: cover; background-position: center; flex: none; }
  .sd-desc { color: #9aa0a6; font-size: 14px; line-height: 1.35; text-align: justify; margin: 14px 0 20px; }
  .cert { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .disc { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; color: #6b5f2a; box-shadow: inset 0 0 0 4px rgba(0,0,0,.15); }
  .cert .r { text-align: right; }
  .cert .r small { display: block; font-size: 10px; letter-spacing: 2px; color: #c9ccd0; font-weight: 600; }
  .cert .r b { font-size: 28px; font-weight: 800; }
  .stats2 { display: flex; justify-content: space-between; margin-bottom: 20px; }
  .stats2 small { display: block; font-size: 10px; letter-spacing: 2px; color: #c9ccd0; font-weight: 600; }
  .stats2 b { font-size: 30px; font-weight: 800; }
  .stats2 div:last-child { text-align: right; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin: 10px 20px 24px; }
  .bars i { flex: 1; background: var(--green); border-radius: 2px 2px 0 0; min-height: 3px; }

  /* ---------- inbox (white) ---------- */
  .inbox { position: fixed; inset: 0; bottom: calc(-1 * var(--gap)); z-index: 30; background: #fff; color: #111; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .inbox .wrap { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 40px); }
  .inbox .hd { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
  .inbox .hd button { width: 36px; height: 36px; display: grid; place-items: center; }
  .inbox .hd h1 { margin: 0; font-size: 40px; font-weight: 900; }
  .inbox .intro { font-size: 13px; text-align: justify; line-height: 1.35; margin: 0 0 14px; }
  .inbox .lbl { font-size: 11px; letter-spacing: 2px; color: #888; font-weight: 600; margin-bottom: 10px; }
  .msg { padding: 14px 8px 18px; border-bottom: 1px solid #ccc; }
  .msg .mh { display: flex; justify-content: space-between; align-items: flex-start; }
  .msg .mh b { font-size: 15px; font-weight: 800; text-transform: uppercase; display: block; }
  .msg .mh small { font-size: 11px; color: #333; }
  .msg .chip { width: 134px; }
  .msg .subj { font-size: 13px; font-weight: 700; margin: 12px 0 2px; }
  .msg .body { font-size: 13px; color: #333; line-height: 1.35; }
  .msg.unread .subj::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); margin-right: 6px; vertical-align: 1px; }
  .msg.done { opacity: .45; }

  /* ---------- generic list rows ---------- */
  .lrow { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #3a4047; gap: 12px; }
  .lrow small { display: block; font-size: 10px; color: #9aa0a6; margin-bottom: 2px; }
  .lrow b { font-size: 17px; font-weight: 800; }
  .lrow .chip { flex: none; }
  .kv { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #3a4047; font-size: 15px; gap: 10px; }
  .kv span:last-child { font-weight: 700; text-align: right; }
  .earn small { font-size: 11px; letter-spacing: 2px; color: #c9ccd0; font-weight: 600; }
  .earn b { display: block; font-size: 26px; font-weight: 800; margin-bottom: 14px; }
  .h3 { font-size: 18px; font-weight: 800; margin: 18px 0 4px; }
  .card { background: var(--panel); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .card b { font-size: 17px; }
  .card p { margin: 6px 0 0; font-size: 13px; color: #c0c4c9; line-height: 1.4; }

  /* ---------- tab bar ---------- */
  .tabs { position: fixed; left: 0; right: 0; bottom: calc(-1 * var(--gap)); z-index: 20; background: var(--bg); padding: 8px 16px calc(env(safe-area-inset-bottom) + 6px + var(--gap)); }
  .tabs .in { max-width: 440px; margin: 0 auto; display: flex; justify-content: space-between; }
  .tabs button { width: 72px; height: 56px; border-radius: 28px; display: grid; place-items: center; color: #c9ccd0; }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs button.on { background: #15181b; }
  .tabs button.on[data-t="home"] { color: var(--green); }
  .tabs button.on[data-t="music"] { color: #5fd3d0; }
  .tabs button.on[data-t="money"] { color: var(--orange); }

  /* ---------- modal ---------- */
  .modal-bg { position: fixed; inset: 0; bottom: calc(-1 * var(--gap)); background: rgba(0,0,0,.55); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
  .modal-bg.show { display: flex; }
  .modal { width: 100%; max-width: 480px; background: #2c3136; border-radius: 22px 22px 0 0; padding: 22px 20px calc(env(safe-area-inset-bottom) + 18px + var(--gap)); max-height: 88vh; overflow-y: auto; animation: up .35s cubic-bezier(.2,.9,.25,1.05); }
  @keyframes up { from { transform: translateY(100%); } }
  .modal h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; text-transform: uppercase; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 86px); transform: translate(-50%, 20px); background: #f2f2f2; color: #111; padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; opacity: 0; transition: .3s; z-index: 80; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- start screen ---------- */
  .start { padding-top: 40px; }
  .start h1 { font-size: 46px; font-weight: 900; line-height: .95; margin: 30px 0 10px; text-transform: uppercase; }
  .start p { color: #c0c4c9; line-height: 1.45; font-size: 15px; }
</style>
