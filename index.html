<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wallet">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="icon.png">
<title>Wallet</title>
<style>
  :root {
    --bg: #f2f2f7;
    --fg: #000;
    --muted: #8e8e93;
    --sheet: #fff;
    --sep: rgba(60,60,67,.18);
    --blue: #0a84ff;
    --red: #ff3b30;
    --green: #34c759;
    --cw: calc(min(100vw, 480px) - 32px);
    --ch: calc(var(--cw) / 1.586);
    --peek: 58px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- Home ---------- */
  .app { max-width: 480px; margin: 0 auto; min-height: 100%; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px); }
  .header { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 14px; }
  .header h1 { font-size: 34px; font-weight: 700; letter-spacing: .3px; margin: 0; }
  .plus { width: 32px; height: 32px; border-radius: 50%; background: #000; display: grid; place-items: center; }
  .plus svg { width: 16px; height: 16px; }

  .stack { position: relative; padding-bottom: 20px; }
  .stack .card + .card { margin-top: calc(var(--peek) - var(--ch)); }
  .stack .card { transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .stack .card:active { transform: translateY(-6px); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; line-height: 1.4; }

  /* ---------- Card ---------- */
  .card {
    position: relative; width: var(--cw); height: var(--ch);
    border-radius: 14px; overflow: hidden; color: #fff;
    box-shadow: 0 -1px 0 rgba(255,255,255,.25) inset, 0 4px 14px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.12);
    background-size: cover; background-position: center;
  }
  .card::after { /* subtle sheen */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 40%);
  }
  .card.dark-text { color: #1c1c1e; }
  .c-name { position: absolute; top: 16px; left: 18px; font-size: 19px; font-weight: 600; letter-spacing: .2px; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-bal { position: absolute; top: 17px; right: 18px; font-size: 17px; font-weight: 600; }
  .c-num { position: absolute; bottom: 16px; left: 18px; font-size: 15px; font-weight: 500; letter-spacing: 1px; opacity: .92; }
  .c-net { position: absolute; bottom: 12px; right: 16px; }
  .net-visa { font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: -.5px; }
  .net-text { font-size: 15px; font-weight: 800; letter-spacing: .6px; }
  .net-mc { display: flex; }
  .net-mc i { width: 30px; height: 30px; border-radius: 50%; display: block; }
  .net-mc i:first-child { background: #eb001b; }
  .net-mc i:last-child { background: #f79e1b; margin-left: -12px; opacity: .85; }

  /* ---------- Screens & sheets ---------- */
  .screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    transform: translateX(100%); transition: transform var(--spring-d, .45s) var(--spring, cubic-bezier(.2,.8,.2,1));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .screen.open { transform: none; }
  .screen-inner { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  .nav { display: flex; justify-content: space-between; align-items: center; height: 44px; margin-bottom: 10px; }
  .nav button { color: var(--blue); font-size: 17px; }
  .nav .done { font-weight: 600; }

  .group { background: var(--sheet); border-radius: 12px; overflow: hidden; margin: 22px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 16px; font-size: 17px; border-bottom: .5px solid var(--sep); }
  .row:last-child { border-bottom: 0; }
  .row .val { color: var(--muted); }
  .row.danger { color: var(--red); justify-content: center; }
  .row.action { color: var(--blue); justify-content: center; }
  .caption { color: var(--muted); font-size: 13px; text-transform: uppercase; margin: 0 16px -14px; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 30; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
    max-width: 480px; margin: 0 auto; max-height: 94vh; overflow-y: auto;
    background: var(--bg); border-radius: 12px 12px 0 0;
    transform: translateY(100%); transition: transform var(--spring-d, .45s) var(--spring, cubic-bezier(.2,.8,.2,1));
    padding: 0 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  .sheet.open { transform: none; }
  .sheet .nav { position: sticky; top: 0; background: var(--bg); z-index: 2; padding-top: 8px; height: 52px; }
  .sheet .nav h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .preview { display: flex; justify-content: center; margin: 8px 0 4px; }

  .field { display: flex; align-items: center; min-height: 46px; padding: 0 16px; border-bottom: .5px solid var(--sep); font-size: 17px; }
  .field:last-child { border-bottom: 0; }
  .field label { width: 120px; flex: none; }
  .field input, .field select { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 17px; background: transparent; color: var(--fg); text-align: right; -webkit-appearance: none; appearance: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 16px; }
  .sw { width: 38px; height: 38px; border-radius: 50%; box-shadow: 0 0 0 .5px rgba(0,0,0,.2); position: relative; }
  .sw.sel::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2.5px solid var(--blue); }
  .upload-row { display: flex; gap: 10px; padding: 12px 16px; }
  .btn { flex: 1; height: 44px; border-radius: 10px; background: rgba(10,132,255,.12); color: var(--blue); font-weight: 600; font-size: 16px; }
  .btn.secondary { background: rgba(255,59,48,.1); color: var(--red); }
  .hint { color: var(--muted); font-size: 13px; padding: 0 16px 12px; line-height: 1.35; }

  /* Secret trigger zone (where the side button sits) */
  .side-zone { position: fixed; top: 80px; right: 0; width: 34px; height: 260px; z-index: 15; }

  /* ---------- Pay mode ---------- */
  .pay { position: fixed; inset: 0; z-index: 50; color: #fff; visibility: hidden; }
  .pay.open { visibility: visible; }
  .pay-bg {
    position: absolute; inset: 0; opacity: 0; will-change: opacity;
    background: rgba(14,14,16,.8);
    -webkit-backdrop-filter: blur(28px) saturate(150%); backdrop-filter: blur(28px) saturate(150%);
  }
  .pay-inner { max-width: 480px; margin: 0 auto; height: 100%; position: relative; padding-top: calc(env(safe-area-inset-top) + 64px); }
  .pay-cancel { position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 18px; font-size: 17px; color: #fff; opacity: 0; }
  .pay-card-wrap { display: flex; justify-content: center; will-change: transform; transform: translateY(110vh); }
  .pay-drag { will-change: transform; }
  .pay-card-wrap .card { box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 .5px rgba(255,255,255,.15); }

  .pay-status { height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: 0; }
  .pay-label { font-size: 17px; font-weight: 500; min-height: 22px; text-align: center; will-change: opacity, transform; }

  .glyph { width: 74px; height: 74px; position: relative; }
  .glyph svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .glyph > svg {
    opacity: 0; transform: scale(.7); transform-origin: 50% 50%; will-change: transform, opacity;
    transition: opacity .22s ease, transform var(--spring-d, .5s) var(--spring, cubic-bezier(.2,.9,.25,1.05));
  }
  .glyph.face .face, .glyph.scanning .ring, .glyph.success .check, .glyph.ready .reader { opacity: 1; transform: none; }
  .glyph.scanning .face { opacity: 0; transform: scale(.55); }
  .glyph.success .ring { opacity: 0; transform: scale(1.15); }
  .glyph.ready .check { opacity: 0; transform: scale(.8); }

  .glyph .face .brackets { transform-origin: 30px 30px; transition: transform .45s cubic-bezier(.3,0,.2,1); }
  .glyph.scanning .face .brackets { transform: rotate(90deg) scale(.8); }
  .ring .spin { transform-origin: 30px 30px; animation: spin .9s linear infinite; }

  .check circle, .check path { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .glyph.success .check circle, .glyph.ready .check circle { stroke-dashoffset: 0; transition: stroke-dashoffset .5s cubic-bezier(.4,0,.2,1); }
  .glyph.success .check path, .glyph.ready .check path { stroke-dashoffset: 0; transition: stroke-dashoffset .35s .28s cubic-bezier(.4,0,.2,1); }

  .reader .wave { opacity: 0; }
  .glyph.ready .reader .wave { animation: wave 1.6s ease-out infinite; }
  .glyph.ready .reader .wave:nth-of-type(2) { animation-delay: .22s; }
  .glyph.ready .reader .wave:nth-of-type(3) { animation-delay: .44s; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wave { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

  .pay-others { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 10px); display: flex; flex-direction: column; align-items: center; }
  .pay-others .card { height: 50px; margin-top: -14px; border-radius: 12px; will-change: transform; transform: translateY(70vh); }
  .pay-others .card:first-child { margin-top: 0; }
  .pay-others .card .c-num, .pay-others .card .c-net { display: none; }
  .pay-others .card .c-name, .pay-others .card .c-bal { top: 9px; font-size: 15px; }

  .shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 30px); transform: translate(-50%, 30px); background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: .3s; z-index: 80; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1 id="title">Wallet</h1>
    <button class="plus" id="addBtn" aria-label="Karte hinzufügen">
      <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="stack" id="stack"></div>
</div>

<div class="side-zone" id="sideZone"></div>

<!-- Card detail -->
<div class="screen" id="detail">
  <div class="screen-inner">
    <div class="nav"><button id="detailBack">‹ Wallet</button><button class="done" id="detailPay">Bezahlen</button></div>
    <div class="preview" id="detailCard"></div>
    <div class="group" id="detailInfo"></div>
    <div class="group">
      <button class="row action" style="width:100%" id="detailEdit">Karte bearbeiten</button>
      <button class="row danger" style="width:100%" id="detailDelete">Karte entfernen</button>
    </div>
  </div>
</div>

<!-- Add / edit sheet -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="nav"><button id="sheetCancel">Abbrechen</button><h2 id="sheetTitle">Karte hinzufügen</h2><button class="done" id="sheetSave">Fertig</button></div>
  <div class="preview" id="preview"></div>

  <div class="group">
    <div class="field"><label for="fName">Name</label><input id="fName" maxlength="24" placeholder="z. B. Girokonto"></div>
    <div class="field"><label for="fLast4">Endziffern</label><input id="fLast4" inputmode="numeric" maxlength="4" placeholder="1234"></div>
    <div class="field"><label for="fBal">Betrag (opt.)</label><input id="fBal" maxlength="14" placeholder="z. B. 11,60 €"></div>
    <div class="field"><label for="fNet">Netzwerk</label>
      <select id="fNet">
        <option value="visa">VISA</option>
        <option value="mc">Mastercard</option>
        <option value="amex">AMEX</option>
        <option value="giro">girocard</option>
        <option value="none">Keins</option>
      </select>
    </div>
  </div>

  <div class="caption">Farbe</div>
  <div class="group"><div class="swatches" id="swatches"></div></div>

  <div class="caption">Eigenes Kartenbild</div>
  <div class="group">
    <div class="upload-row">
      <button class="btn" id="uploadBtn">Bild hochladen</button>
      <button class="btn secondary" id="removeImg" hidden>Bild entfernen</button>
    </div>
    <div class="hint">Das Bild wird automatisch auf Kartenformat zugeschnitten und ersetzt Farbe und Text.</div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
</div>

<!-- Pay mode -->
<div class="pay" id="pay">
  <div class="pay-bg" id="payBg"></div>
  <div class="pay-inner">
    <button class="pay-cancel" id="payCancel">Abbrechen</button>
    <div class="pay-card-wrap" id="payCard"><div class="pay-drag" id="payDrag"></div></div>
    <div class="pay-status" id="payStatus">
      <div class="glyph" id="glyph">
        <!-- Face ID -->
        <svg class="face" viewBox="0 0 60 60" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <g class="brackets">
            <path d="M4 18V10a6 6 0 0 1 6-6h8"/><path d="M42 4h8a6 6 0 0 1 6 6v8"/>
            <path d="M56 42v8a6 6 0 0 1-6 6h-8"/><path d="M18 56h-8a6 6 0 0 1-6-6v-8"/>
          </g>
          <path d="M20 21v5"/><path d="M40 21v5"/>
          <path d="M31 21v12h-3"/>
          <path d="M21 41c5 5 13 5 18 0"/>
        </svg>
        <!-- spinner ring -->
        <svg class="ring" viewBox="0 0 60 60" fill="none">
          <circle cx="30" cy="30" r="27" stroke="rgba(255,255,255,.18)" stroke-width="3"/>
          <circle class="spin" cx="30" cy="30" r="27" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="38 200"/>
        </svg>
        <!-- success -->
        <svg class="check" viewBox="0 0 60 60" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="30" cy="30" r="27" pathLength="1" transform="rotate(-90 30 30)"/>
          <path d="M18 31l8 8 16-17" pathLength="1"/>
        </svg>
        <!-- hold near reader -->
        <svg class="reader" viewBox="0 0 60 60" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="12" width="22" height="38" rx="5"/>
          <path d="M14 16h6"/>
          <path class="wave" d="M36 24c3 4 3 10 0 14"/>
          <path class="wave" d="M42 19c5.5 7 5.5 17 0 24"/>
          <path class="wave" d="M48 14c8 10 8 24 0 34"/>
        </svg>
      </div>
      <div class="pay-label" id="payLabel"></div>
    </div>
    <div class="pay-others" id="payOthers"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'wallet.cards.v1';
  const SWATCHES = [
    { c: 'linear-gradient(135deg,#1c1c1e,#3a3a3c)', dark: false },
    { c: 'linear-gradient(135deg,#0a3d91,#2f7be0 60%,#58a6ff)', dark: false },
    { c: 'linear-gradient(135deg,#1f9d55,#3cc96b)', dark: false },
    { c: 'linear-gradient(135deg,#5b0f1a,#9b1c2c 55%,#c3343f)', dark: false },
    { c: 'linear-gradient(135deg,#f6d1e6,#e8b6f0 35%,#bfe3f7 70%,#f7e7a8)', dark: true },
    { c: 'linear-gradient(135deg,#ececec,#ffffff 50%,#d9d9d9)', dark: true },
    { c: 'linear-gradient(135deg,#b8860b,#e6c35c 50%,#a87b10)', dark: true },
    { c: 'linear-gradient(135deg,#5e2ced,#a855f7)', dark: false },
    { c: 'linear-gradient(135deg,#ff6a00,#ff9f43)', dark: false },
    { c: 'linear-gradient(135deg,#6e6e73,#a1a1a6 50%,#6e6e73)', dark: false },
  ];
  const DEFAULTS = [
    { name: 'Cash', last4: '', balance: '11,60 €', network: 'none', color: 0 },
    { name: 'Kreditkarte', last4: '4821', network: 'mc', color: 4 },
    { name: 'Girokonto', last4: '0937', network: 'giro', color: 5 },
    { name: 'Freedom', last4: '2210', network: 'visa', color: 1 },
    { name: 'Debit', last4: '7765', network: 'visa', color: 2 },
    { name: 'Rewards', last4: '5502', network: 'mc', color: 3 },
  ];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const uid = () => Math.random().toString(36).slice(2, 10);

  let cards = load();
  let currentId = null;
  let editingId = null;
  let draft = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return DEFAULTS.map((c) => ({ id: uid(), image: null, ...c }));
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(cards)); return true; }
    catch (e) { toast('Speicher voll – kleineres Bild versuchen'); return false; }
  }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function netHTML(n) {
    if (n === 'visa') return '<span class="net-visa">VISA</span>';
    if (n === 'mc') return '<span class="net-mc"><i></i><i></i></span>';
    if (n === 'amex') return '<span class="net-text">AMEX</span>';
    if (n === 'giro') return '<span class="net-text" style="font-style:italic;text-transform:lowercase">girocard</span>';
    return '';
  }
  function cardHTML(c) {
    if (c.image) {
      return `<div class="card" data-id="${c.id}" style="background-image:url('${c.image}')"></div>`;
    }
    const sw = SWATCHES[c.color] || SWATCHES[0];
    return `<div class="card ${sw.dark ? 'dark-text' : ''}" data-id="${c.id}" style="background:${sw.c}">
      <div class="c-name">${esc(c.name)}</div>
      ${c.balance ? `<div class="c-bal">${esc(c.balance)}</div>` : ''}
      ${c.last4 ? `<div class="c-num">•••• ${esc(c.last4)}</div>` : ''}
      <div class="c-net">${netHTML(c.network)}</div>
    </div>`;
  }

  /* ---------- Home ---------- */
  function render() {
    const s = $('stack');
    s.innerHTML = cards.length
      ? cards.map(cardHTML).join('')
      : '<div class="empty">Noch keine Karten.<br>Tippe auf + um eine Karte hinzuzufügen.</div>';
  }
  $('stack').addEventListener('click', (e) => {
    const el = e.target.closest('.card'); if (!el) return;
    openDetail(el.dataset.id);
  });

  /* ---------- Detail ---------- */
  function openDetail(id) {
    const c = cards.find((x) => x.id === id); if (!c) return;
    currentId = id;
    $('detailCard').innerHTML = cardHTML(c);
    const net = { visa: 'VISA', mc: 'Mastercard', amex: 'American Express', giro: 'girocard', none: '—' }[c.network] || '—';
    $('detailInfo').innerHTML = `
      <div class="row"><span>Name</span><span class="val">${esc(c.name || '—')}</span></div>
      <div class="row"><span>Kartennummer</span><span class="val">${c.last4 ? '•••• ' + esc(c.last4) : '—'}</span></div>
      <div class="row"><span>Netzwerk</span><span class="val">${net}</span></div>
      ${c.balance ? `<div class="row"><span>Guthaben</span><span class="val">${esc(c.balance)}</span></div>` : ''}`;
    $('detail').classList.add('open');
  }
  $('detailBack').onclick = () => $('detail').classList.remove('open');
  $('detailPay').onclick = () => openPay(currentId);
  $('detailEdit').onclick = () => openSheet(currentId);
  $('detailDelete').onclick = () => {
    if (!confirm('Diese Karte entfernen?')) return;
    cards = cards.filter((c) => c.id !== currentId);
    save(); render();
    $('detail').classList.remove('open');
  };

  /* ---------- Add / Edit ---------- */
  function openSheet(id) {
    editingId = id || null;
    const src = id ? cards.find((c) => c.id === id) : null;
    draft = src ? { ...src } : { id: uid(), name: '', last4: '', balance: '', network: 'visa', color: 1, image: null };
    $('sheetTitle').textContent = id ? 'Karte bearbeiten' : 'Karte hinzufügen';
    $('fName').value = draft.name; $('fLast4').value = draft.last4; $('fBal').value = draft.balance || ''; $('fNet').value = draft.network;
    renderSwatches(); updatePreview();
    $('backdrop').classList.add('open'); $('sheet').classList.add('open');
  }
  function closeSheet() {
    $('backdrop').classList.remove('open'); $('sheet').classList.remove('open');
    $('file').value = '';
  }
  function renderSwatches() {
    $('swatches').innerHTML = SWATCHES.map((s, i) =>
      `<button class="sw ${i === draft.color && !draft.image ? 'sel' : ''}" data-i="${i}" style="background:${s.c}"></button>`).join('');
  }
  function updatePreview() {
    $('preview').innerHTML = cardHTML({ ...draft, name: draft.name || 'Neue Karte' });
    $('removeImg').hidden = !draft.image;
  }
  $('swatches').addEventListener('click', (e) => {
    const b = e.target.closest('.sw'); if (!b) return;
    draft.color = +b.dataset.i; draft.image = null;
    renderSwatches(); updatePreview();
  });
  ['fName', 'fLast4', 'fBal', 'fNet'].forEach((id) => $(id).addEventListener('input', () => {
    if (id === 'fLast4') $(id).value = $(id).value.replace(/\D/g, '').slice(0, 4);
    draft.name = $('fName').value.trim();
    draft.last4 = $('fLast4').value;
    draft.balance = $('fBal').value.trim();
    draft.network = $('fNet').value;
    updatePreview();
  }));
  $('uploadBtn').onclick = () => $('file').click();
  $('removeImg').onclick = () => { draft.image = null; renderSwatches(); updatePreview(); };
  $('file').addEventListener('change', async () => {
    const f = $('file').files[0]; if (!f) return;
    try { draft.image = await cropToCard(f); renderSwatches(); updatePreview(); }
    catch (e) { toast('Bild konnte nicht geladen werden'); }
  });
  $('addBtn').onclick = () => openSheet(null);
  $('sheetCancel').onclick = closeSheet;
  $('backdrop').onclick = closeSheet;
  $('sheetSave').onclick = () => {
    if (!draft.name && !draft.image) { $('fName').focus(); toast('Bitte einen Namen eingeben'); return; }
    const prev = cards.slice();
    if (editingId) cards = cards.map((c) => (c.id === editingId ? draft : c));
    else cards.push(draft);
    if (!save()) { cards = prev; return; }
    render(); closeSheet();
    if (editingId) openDetail(editingId);
  };

  function cropToCard(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const ratio = 1.586;
        let sw = img.naturalWidth, sh = sw / ratio;
        if (sh > img.naturalHeight) { sh = img.naturalHeight; sw = sh * ratio; }
        const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
        const w = Math.round(Math.min(900, sw)), h = Math.round(w / ratio);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(); };
      img.src = url;
    });
  }

  /* ---------- Spring physics (iOS-like) ---------- */
  // Builds a CSS linear() easing that samples a real damped spring, so the
  // motion has the same weight and slight overshoot as UIKit animations.
  const LINEAR_OK = window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)');
  function spring({ stiffness = 200, damping = 22, mass = 1 } = {}, fallback = 'cubic-bezier(.2,.9,.25,1.05)') {
    const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
    const wd = w0 * Math.sqrt(Math.max(1e-6, 1 - z * z));
    const x = (t) => z < 1
      ? 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t))
      : 1 - (1 + w0 * t) * Math.exp(-w0 * t);
    let T = 0;
    for (let t = 0; t < 4; t += 1 / 240) if (Math.abs(1 - x(t)) > 0.0015) T = t;
    T += 1 / 60;
    const pts = [];
    for (let i = 0; i <= 64; i++) pts.push(+x((T * i) / 64).toFixed(4));
    pts[64] = 1;
    return { duration: Math.round(T * 1000), easing: LINEAR_OK ? `linear(${pts.join(', ')})` : fallback };
  }
  const SPRING_CARD = spring({ stiffness: 190, damping: 21 });    // card flying in, tiny overshoot
  const SPRING_STACK = spring({ stiffness: 210, damping: 25 });   // card stack at the bottom
  const SPRING_SNAP = spring({ stiffness: 400, damping: 30 });    // snap back after drag
  const SPRING_UI = spring({ stiffness: 320, damping: 24 });      // glyph / sheets
  const OUT = 'cubic-bezier(.4,0,1,1)';
  document.documentElement.style.setProperty('--spring', SPRING_UI.easing);
  document.documentElement.style.setProperty('--spring-d', SPRING_UI.duration + 'ms');

  /* ---------- Pay mode ---------- */
  let payToken = 0;
  let payOpen = false;
  let anims = [];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const pay = $('pay'), bg = $('payBg'), wrap = $('payCard'), drag = $('payDrag'),
    others = $('payOthers'), status = $('payStatus'), cancelBtn = $('payCancel'), glyph = $('glyph'), label = $('payLabel');

  function play(el, frames, opts) {
    const a = el.animate(frames, { fill: 'both', ...opts });
    anims.push(a);
    return a;
  }
  function stopAll() { anims.forEach((a) => a.cancel()); anims = []; }

  function openPay(id) {
    if (!cards.length) { toast('Keine Karten vorhanden'); return; }
    if (payOpen) return;
    payOpen = true;
    const sel = cards.find((c) => c.id === id) || cards[0]; // top card of the stack
    renderPay(sel.id);
    $('detail').classList.remove('open');
    closeSheet();
    stopAll();
    pay.classList.add('open');
    play(bg, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'cubic-bezier(.2,0,0,1)' });
    play(wrap, [{ transform: 'translateY(105vh) scale(.94)' }, { transform: 'translateY(0) scale(1)' }], SPRING_CARD);
    [...others.children].forEach((el, i) =>
      play(el, [{ transform: 'translateY(70vh)' }, { transform: 'translateY(0)' }], { ...SPRING_STACK, delay: 70 + i * 28 }));
    play(cancelBtn, [{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: 180, easing: 'ease-out' });
    play(status, [{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: 160, easing: 'ease-out' });
    runAuth(380);
  }

  function renderPay(id) {
    currentId = id;
    const c = cards.find((x) => x.id === id);
    drag.innerHTML = cardHTML(c);
    others.innerHTML = cards.filter((x) => x.id !== id).slice(-5).map(cardHTML).join('');
  }

  function setLabel(text) {
    if (label.textContent === text) return;
    if (!label.textContent) { label.textContent = text; label.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'ease-out' }); return; }
    const a = label.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'ease-in', fill: 'forwards' });
    a.onfinish = () => {
      label.textContent = text;
      a.cancel();
      if (text) label.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'ease-out' });
    };
  }

  async function runAuth(delay = 0) {
    const t = ++payToken;
    glyph.className = 'glyph'; label.textContent = '';
    await wait(delay); if (t !== payToken) return;
    glyph.className = 'glyph face'; setLabel('Face ID');
    await wait(420); if (t !== payToken) return;
    glyph.className = 'glyph scanning';
    await wait(1150); if (t !== payToken) return;
    glyph.className = 'glyph success'; setLabel('');
    await wait(900); if (t !== payToken) return;
    glyph.className = 'glyph ready'; setLabel('Ans Lesegerät halten');
  }

  async function closePay() {
    if (!payOpen) return;
    payOpen = false;
    payToken++;
    const dur = 300;
    const from = getComputedStyle(drag).transform;
    stopAll();
    play(drag, [{ transform: from === 'none' ? 'none' : from }, { transform: 'translateY(0)' }], { duration: 0 });
    const a = play(wrap, [{ transform: 'translateY(0)' }, { transform: 'translateY(105vh)' }], { duration: dur, easing: OUT });
    [...others.children].reverse().forEach((el, i) =>
      play(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(70vh)' }], { duration: dur, delay: i * 18, easing: OUT }));
    play(status, [{ opacity: 1 }, { opacity: 0 }], { duration: 150, easing: 'ease-in' });
    play(cancelBtn, [{ opacity: 1 }, { opacity: 0 }], { duration: 150, easing: 'ease-in' });
    play(bg, [{ opacity: 1 }, { opacity: 0 }], { duration: dur + 60, delay: 60, easing: 'ease-in-out' });
    await a.finished.catch(() => {});
    await wait(120);
    if (payOpen) return;
    stopAll();
    drag.style.transform = '';
    pay.classList.remove('open');
    glyph.className = 'glyph'; label.textContent = '';
  }
  cancelBtn.onclick = closePay;

  // switch card: current one drops, new one springs up, Face ID runs again
  others.addEventListener('click', (e) => {
    const el = e.target.closest('.card'); if (!el || !payOpen) return;
    payToken++;
    glyph.className = 'glyph'; setLabel('');
    const down = wrap.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(105vh)' }], { duration: 220, easing: OUT, fill: 'forwards' });
    anims.push(down);
    down.onfinish = () => {
      if (!payOpen) return;
      renderPay(el.dataset.id);
      play(wrap, [{ transform: 'translateY(105vh) scale(.94)' }, { transform: 'translateY(0) scale(1)' }], SPRING_CARD);
      [...others.children].forEach((c, i) => play(c, [{ transform: 'translateY(30px)' }, { transform: 'translateY(0)' }], { ...SPRING_STACK, delay: i * 20 }));
      runAuth(250);
    };
  });

  // swipe the card down to dismiss (follows the finger, rubber-bands upward)
  (() => {
    let y0 = null, dy = 0, t0 = 0, snap = null;
    drag.addEventListener('touchstart', (e) => {
      if (snap) { snap.cancel(); snap = null; }
      y0 = e.touches[0].clientY; dy = 0; t0 = Date.now();
    }, { passive: true });
    drag.addEventListener('touchmove', (e) => {
      if (y0 == null) return;
      const d = e.touches[0].clientY - y0;
      dy = d > 0 ? d : -Math.sqrt(-d) * 3; // resistance when pulled up
      drag.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    drag.addEventListener('touchend', () => {
      if (y0 == null) return;
      const v = dy / Math.max(1, Date.now() - t0); // px per ms
      y0 = null;
      if (dy > 140 || (dy > 40 && v > 0.6)) { closePay(); return; }
      snap = drag.animate([{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }], SPRING_SNAP);
      drag.style.transform = '';
    });
  })();

  /* ---------- Triggers ---------- */
  function onDoubleTap(el, fn) {
    let last = 0;
    el.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - last < 350) { e.preventDefault(); last = 0; fn(); } else last = now;
    });
    el.addEventListener('dblclick', fn); // desktop testing
  }
  onDoubleTap($('sideZone'), () => openPay(null));
  onDoubleTap($('title'), () => openPay(null));
  document.addEventListener('keydown', (e) => { if (e.key === 'p') openPay(null); if (e.key === 'Escape') closePay(); });

  // URL trigger: …/index.html#pay opens pay mode directly.
  // Used by an iOS Shortcut bound to Back Tap / Action Button (see README).
  function checkHash() {
    if (location.hash === '#pay') {
      history.replaceState(null, '', location.pathname + location.search);
      setTimeout(() => openPay(null), 60);
    }
  }
  window.addEventListener('hashchange', checkHash);
  window.addEventListener('pageshow', checkHash);

  render();
  checkHash();
})();
</script>
</body>
</html>
