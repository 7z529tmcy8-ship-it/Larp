<script>
(() => {
  'use strict';
  /* =====================================================================
     Data
     ===================================================================== */
  const KEY = 'rapstar.v1';
  const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const GRADES = ['F','D-','D','D+','C-','C','C+','B-','B','B+','A-','A','A+'];
  const TALENTS = [
    ['studio', 'Studio'], ['charisma', 'Charisma'], ['musicality', 'Musicality'], ['rhythm', 'Rhythm'],
    ['songwriting', 'Songwriting'], ['virality', 'Virality'], ['video', 'Video'],
  ];
  const BUSINESS = [['leadership', 'Leadership'], ['marketing', 'Marketing'], ['negotiation', 'Negotiation']];
  const BUSINESS_FAME = 54; // grade B- unlocks business skills

  const HIRES = {
    artistry: [[null, 0, 0], ['Vocal Coach Mia', 35, 1500], ['Toni Faust', 60, 12000], ['Nyla Grey', 80, 75000], ['Kilo Mane', 95, 350000]],
    writing: [[null, 0, 0], ['Ghostwriter Ben', 35, 1000], ['Lex Pen', 60, 10000], ['Sami Drift', 80, 60000], ['Baba Zed', 95, 300000]],
    studio: [[null, 0, 0], ['Keller Studio', 35, 800], ['Blue Room', 60, 8000], ['Skyline Studios', 80, 50000], ['Gold Lane Studios', 95, 250000]],
  };
  const DIRECTORS = [[null, 0, 0], ['Handycam Hasan', 40, 2000], ['Mira Vision', 65, 25000], ['Neon Frames', 82, 150000], ['Oscar Klein', 95, 600000]];
  const STYLES = [
    ['Lyric', 0, 0, 'A raw, low-budget video that leans on authenticity and creativity over polish.'],
    ['Performance', 5000, .12, 'You and a mic in front of a wall of lights. Clean, loud, effective.'],
    ['Story', 25000, .22, 'A short film with actors, locations and a twist at the end.'],
    ['Cinematic', 120000, .35, 'Blockbuster budget, drones, cars and a skyline at sunset.'],
  ];
  const NPC_NAMES = ['Kay Brix', 'Lio Vance', 'MC Salvo', 'Jaye Moon', 'Ricco 7', 'Nyla Grey', 'Baba Zed', 'Toni Faust', 'Kilo Mane', 'Sami Drift', 'Yung Pfand', 'Leni Lux', 'Dari Blue', 'Ozan 44', 'Vex Royal', 'Mona Kash'];
  const WORDS1 = ['Berlin', 'Nachts', 'Kein', 'Gold', 'Blaue', 'Letzte', 'Mama', 'Paris', 'Benz', 'Hoch', 'Million', 'Block', 'Neon', 'Ghetto', 'Winter', 'Bando'];
  const WORDS2 = ['Lichter', 'Liebe', 'Kette', 'Träume', 'Flex', 'Runde', 'Stadt', 'Pläne', 'Tränen', 'Zeit', 'Gang', 'Regen', 'Wellen', 'Herz', 'Story', 'Drip'];
  const FESTIVALS = [
    ['Splash Jam', 'Gräfenhainichen, Germany', 60000, 4], ['Frauenfeld Openair', 'Frauenfeld, Switzerland', 180000, 18],
    ['Roskilde', 'Roskilde, Denmark', 130000, 25], ['Sziget', 'Óbuda Island, Budapest, Hungary', 450000, 35],
    ['Donauinselfest', 'Vienna, Austria', 2600000, 30], ['Rolling Loud', 'Miami, Florida', 260000, 50],
    ['Wireless', 'London, England', 150000, 45], ['Newport Jazz Festival', 'Newport, Rhode Island', 30000, 40],
    ['Coachella', 'Indio, California', 710000, 70], ['Halftime Show', 'Super Bowl', 4600000, 92],
  ];
  const LABELS = ['Kopfnicker Records', 'Blackbox Music', 'Asphalt Gold', 'Nordlicht Entertainment', 'Crown Tier', 'Sunset Boulevard Records'];
  const COVERS = [
    'linear-gradient(160deg,#f3d3c9 0%,#c7b6d8 45%,#8fb3cf 100%)',
    'radial-gradient(circle at 50% 40%,#ffb36b 0%,#a14b3a 35%,#1d1d2a 75%)',
    'linear-gradient(180deg,#9fd0ef 0%,#f1e2b5 55%,#c48d4e 100%)',
    'radial-gradient(circle at 30% 30%,#ffd46b 0%,#ff4d6d 40%,#3b1056 85%)',
    'linear-gradient(135deg,#111 0%,#444 100%)',
    'linear-gradient(135deg,#2bd2a0 0%,#1a4f8a 100%)',
  ];

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rint = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const de = (n) => Math.round(n).toLocaleString('de-DE');
  function compact(n) {
    n = Math.round(n);
    const a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    if (a >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (a >= 1e4) return Math.round(n / 1e3) + 'K';
    if (a >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }
  const euro = (n) => de(n) + ' €';
  function euroK(n) {
    if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + ' €B';
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + ' €M';
    if (Math.abs(n) >= 1e3) return Math.round(n / 1e3) + ' €K';
    return Math.round(n) + ' €';
  }

  /* =====================================================================
     State
     ===================================================================== */
  let S = null;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Speicher voll – Cover-Bilder verkleinern'); } }
  function load() { try { const r = localStorage.getItem(KEY); if (r) S = JSON.parse(r); } catch (e) {} }

  function makeNpcs() {
    return NPC_NAMES.map((n) => ({ name: n, listeners: Math.round(10 ** rnd(4.2, 7.6)), hit: songName() }));
  }
  function songName() { return Math.random() < .5 ? `${pick(WORDS1)} ${pick(WORDS2)}` : `${pick(WORDS1).toLowerCase()} x ${pick(NPC_NAMES).split(' ')[0].toLowerCase()}`; }

  function newGame(name, rich) {
    S = {
      v: 1, name: name || 'Run It Up',
      cash: 2500, energy: 100, date: '2026-01-05', week: 0,
      talents: { studio: 1, charisma: 5, musicality: 5, rhythm: 5, songwriting: 5, virality: 5, video: 5, leadership: 1, marketing: 1, negotiation: 1 },
      listeners: 0, followers: 50, history: [0],
      songs: [], albums: [], inbox: [], festivals: [], posts: [],
      npcs: makeNpcs(),
      trend: 'TRAP', trendWeeks: 6,
      label: null, partner: null, awards: [],
      lastIncome: { streams: 0, label: 0, streamsCount: 0 },
      earnings: { streams: 0, festivals: 0, tours: 0, jobs: 0 },
      lastTour: -99,
    };
    welcomeMail();
    if (rich) makeRich();
    save();
  }

  function makeRich() {
    Object.assign(S, { cash: 442041757, date: '2033-09-16', week: 400, listeners: 35535528, followers: 4200000 });
    Object.assign(S.talents, { studio: 100, charisma: 1, musicality: 100, rhythm: 100, songwriting: 100, virality: 52, video: 48, leadership: 10 });
    const al = [['Free Sex', 0], ['Berlin Hates You', 2], ['Beeil Dich Wir Werden Erwachsen', 3]].map(([n, c]) => ({ id: uid(), name: n, cover: COVERS[c], week: 380 }));
    S.albums = al;
    const songs = [
      ["suv's x djunis", 0, 73, 1922194699], ['bentayga x toujour', 1, 72, 1400000000], ['work it x fdg', 2, 70, 1300000000],
      ['boom! x c4rl', null, 73, 342601697], ['361 x ufo', null, 67, 117633970], ['kalte gasse x 6eyno', null, 71, 342226685],
      ['aszendent x beslik', null, 63, 200628717], ['berliner mf x djunis', null, 71, 324588150], ['ysp x c4rl', null, 68, 433117053],
      ['sterling x c4rl', null, 67, 446169863], ['tuesday x 234', null, 67, 843493337], ['dienstag x 234', 0, 64, 806514528],
    ];
    S.songs = songs.map(([t, a, q, st], i) => {
      const weekly = []; let w = st / 60;
      for (let k = 0; k < 24; k++) { weekly.unshift(Math.round(w * rnd(.8, 1.2))); w *= 1.04; }
      return { id: uid(), title: t, albumId: a == null ? null : al[a].id, quality: q, genre: 'TRAP', feat: null, week: 381 + i + (i > 5 ? 6 : 0),
        streams: st, revenue: st * .001, weekly, debut: Math.round(st / 18), video: null };
    });
    S.history = Array.from({ length: 52 }, (_, i) => Math.round(25163590 + (i / 51) * 10300000 + rnd(-3e5, 3e5)));
    S.history[51] = S.listeners;
    S.awards = [{ year: 2031, name: 'Song des Jahres', what: "suv's x djunis" }];
  }

  /* ---------- derived values ---------- */
  const fameScore = () => clamp(Math.round(Math.log10(S.listeners + S.followers * .5 + 1) / 7.9 * 100), 0, 100);
  const grade = (f = fameScore()) => GRADES[clamp(Math.floor(f / (100 / GRADES.length)), 0, GRADES.length - 1)];
  const maxEnergy = () => 100 + S.talents.leadership;
  const talentTotal = () => Math.round(Object.values(S.talents).reduce((a, b) => a + b, 0) / 10);
  const totalListens = () => S.songs.reduce((a, s) => a + s.streams, 0);
  const selfSkill = {
    artistry: () => Math.round((S.talents.charisma + S.talents.musicality + S.talents.rhythm) / 3),
    writing: () => S.talents.songwriting,
    studio: () => S.talents.studio,
    video: () => S.talents.video,
  };
  const songAlbum = (s) => S.albums.find((a) => a.id === s.albumId);
  const songCover = (s) => (songAlbum(s) || {}).cover || COVERS[Math.abs(hash(s.id)) % COVERS.length];
  const coverCss = (c) => (c && c.startsWith('data:') ? `url('${c}')` : c);
  function hash(t) { let h = 0; for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; }
  function dateObj(iso = S.date) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  const dateShort = (iso) => { const d = dateObj(iso); return `${String(d.getUTCMonth() + 1).padStart(2, '0')}/${String(d.getUTCDate()).padStart(2, '0')}/${d.getUTCFullYear()}`; };
  const year = () => dateObj().getUTCFullYear();
  const labelShare = () => (S.label ? S.label.keep : 1);

  /* =====================================================================
     Weekly simulation
     ===================================================================== */
  function songWeekStreams(s) {
    const age = S.week - s.week - 1; // 0 = release week
    const feat = s.feat ? (S.npcs.find((n) => n.name === s.feat) || { listeners: 0 }).listeners : 0;
    let audience = S.listeners + S.followers * .5 + 2000 + feat * .25 * Math.max(0, 1 - age / 8);
    audience *= 1 - clamp(audience / 9e7, 0, .9); // market saturation
    const q = (s.quality / 100) ** 1.6;
    let mult = (1 + S.talents.virality / 150) * (1 + S.talents.marketing / 120);
    if (S.label) mult *= S.label.boost;
    if (s.video) mult *= 1 + s.video.bonus * Math.max(.3, 1 - (S.week - s.video.week) / 20);
    if (s.genre === S.trend) mult *= 1.1;
    const decay = .87 ** age + .03;
    return Math.round(audience * 1.15 * q * mult * decay * rnd(.85, 1.2));
  }

  function endWeek() {
    const report = { streams: 0, rev: 0, labelCut: 0, events: [] };
    const fameBefore = grade();
    const lBefore = S.listeners;
    S.week++;
    const d = dateObj(); d.setUTCDate(d.getUTCDate() + 7);
    const newDate = d.toISOString().slice(0, 10);
    const yearChanged = newDate.slice(0, 4) !== S.date.slice(0, 4);
    S.date = newDate;

    // streams & money
    let weekTotal = 0;
    S.songs.forEach((s) => {
      if (S.week - s.week < 1) return;
      const st = songWeekStreams(s);
      const gross = st * .004;
      s.streams += st; s.revenue += gross * labelShare();
      s.weekly.push(st); if (s.weekly.length > 26) s.weekly.shift();
      if (S.week - s.week === 1) s.debut = st;
      weekTotal += st;
      report.rev += gross * labelShare();
      report.labelCut += gross * (1 - labelShare());
    });
    report.streams = weekTotal;
    S.cash += report.rev;
    S.earnings.streams += report.rev;

    // listeners & followers
    const target = weekTotal * .55 + S.followers * .15;
    S.listeners = Math.round(S.listeners * .55 + target * .45);
    S.followers = Math.round(S.followers * 1.002 + weekTotal * .004 * (1 + S.talents.charisma / 100));
    S.history.push(S.listeners); if (S.history.length > 52) S.history.shift();

    // relationship
    if (S.partner) {
      S.partner.love = clamp(S.partner.love - 3, 0, 100);
      if (S.partner.love <= 0) { report.events.push(`${S.partner.name} hat Schluss gemacht.`); S.partner = null; }
    }
    // label term
    if (S.label) { S.label.weeksLeft--; if (S.label.weeksLeft === 0) report.events.push(`Dein Vertrag mit ${S.label.name} ist ausgelaufen – du kannst ihn jetzt kündigen oder weiterlaufen lassen.`); }

    // trend
    if (--S.trendWeeks <= 0) {
      S.trend = S.trend === 'TRAP' ? 'CLEAN' : 'TRAP'; S.trendWeeks = rint(4, 9);
      report.events.push(`Neuer Trend: ${S.trend} ist gerade angesagt.`);
    }
    // npc drift
    S.npcs.forEach((n) => { n.listeners = Math.round(n.listeners * rnd(.96, 1.05)); if (Math.random() < .15) n.hit = songName(); });

    // awards at new year
    if (yearChanged) awardsCeremony(report);

    // mail
    const before = S.inbox.length;
    weeklyMail();
    const newMail = S.inbox.length - before;
    if (newMail) report.events.push(`${newMail} neue Nachricht${newMail > 1 ? 'en' : ''} in der Inbox.`);

    S.energy = maxEnergy();
    S.lastIncome = { streams: report.rev, label: report.labelCut, streamsCount: weekTotal };
    const fameAfter = grade();
    if (fameAfter !== fameBefore) report.events.unshift(`Fame: ${fameBefore} → ${fameAfter}`);
    save();
    showReport(report, lBefore);
  }

  function awardsCeremony(report) {
    const y = year() - 1;
    const yearStreams = (s) => s.weekly.slice(-52).reduce((a, b) => a + b, 0);
    const best = S.songs.slice().sort((a, b) => yearStreams(b) - yearStreams(a))[0];
    const topNpc = Math.max(...S.npcs.map((n) => n.listeners)) * 6;
    const won = [];
    if (best && yearStreams(best) > topNpc) won.push({ year: y, name: 'Song des Jahres', what: best.title });
    if (fameScore() >= 85) won.push({ year: y, name: 'Artist des Jahres', what: S.name });
    if (S.week < 60 && fameScore() >= 35) won.push({ year: y, name: 'Newcomer des Jahres', what: S.name });
    const albumsY = S.albums.map((a) => ({ a, st: S.songs.filter((s) => s.albumId === a.id).reduce((x, s) => x + yearStreams(s), 0) })).sort((p, q) => q.st - p.st);
    if (albumsY[0] && albumsY[0].st > topNpc * 2) won.push({ year: y, name: 'Album des Jahres', what: albumsY[0].a.name });
    S.awards.push(...won);
    if (won.length) { S.followers = Math.round(S.followers * (1 + .05 * won.length)); report.events.push(`🏆 Awards ${y}: ${won.map((w) => w.name).join(', ')}!`); }
    else report.events.push(`Awards ${y}: diesmal leer ausgegangen.`);
  }

  /* ---------- inbox generation ---------- */
  function mail(from, tag, subj, body, action) {
    S.inbox.unshift({ id: uid(), from, tag, subj, body, date: S.date, read: false, done: false, action: action || null });
    if (S.inbox.length > 60) S.inbox.length = 60;
  }
  function welcomeMail() {
    mail('Mama', 'FAN', 'Ich bin stolz auf dich', `Egal was alle sagen, ${S.name}: mach deine Musik. Und iss was Richtiges.`);
  }
  function weeklyMail() {
    const f = fameScore();
    const anySong = S.songs.length ? pick(S.songs).title : null;
    if (anySong && Math.random() < .25 + f / 200) {
      mail('Fan Mail', 'FAN', pick([`Bro. "${anySong}".`, `${anySong} läuft bei mir auf Repeat`, `Ich höre ${anySong} im Bus`]),
        pick([`I heard your music and immediately started overthinking my whole life.`, `Mein ganzer Jahrgang feiert dich. Bitte mehr davon.`, `${S.name} you could steal my wallet and I'd say thank you for touching it.`]));
    }
    if (f >= 12 && Math.random() < .3) {
      const pool = S.npcs.filter((n) => n.listeners < (S.listeners + 2e4) * 3).sort(() => Math.random() - .5);
      const n = pool[0];
      if (n) mail(n.name, 'FEATURE', `${S.name}, you free to hop on a track? - ${n.name}`, `I got the beat, the vibe, the hook… just need you to complete it, ${S.name}.`, { type: 'feature', npc: n.name });
    }
    const fes = FESTIVALS.filter((x) => x[3] <= f && !S.festivals.some((p) => p.name === x[0] && p.year === year()) && !S.inbox.some((m) => m.action && m.action.type === 'festival' && !m.done && m.action.name === x[0]));
    if (fes.length && Math.random() < .12 + f / 250) {
      const x = pick(fes);
      const fee = Math.round((x[2] * .05 + S.listeners * .02) * (1 + S.talents.negotiation / 100) / 100) * 100;
      mail(x[0], 'FESTIVAL', `You're on ${x[0]}'s Booking Radar`, `We are reaching out with interest in adding you to the ${x[0]} lineup. Your sound feels fresh, your audience is engaged, and we believe you would be a great fit.`,
        { type: 'festival', name: x[0], place: x[1], attended: x[2], fee });
    }
    if (!S.label && f >= 30 && Math.random() < .12) {
      const offer = makeLabelOffer();
      mail(offer.name, 'LABEL', 'Wir wollen dich signen', `${offer.name} bietet dir ${euro(offer.advance)} Vorschuss. Du behältst ${Math.round(offer.keep * 100)} % deiner Streaming-Einnahmen, dafür pushen wir dich überall (+${Math.round((offer.boost - 1) * 100)} % Streams).`, { type: 'label', offer });
    }
  }
  function makeLabelOffer() {
    const neg = S.talents.negotiation;
    return { name: pick(LABELS), advance: Math.round((S.listeners * .4 + 8000) * (1 + neg / 80) / 1000) * 1000, keep: +clamp(.25 + neg / 400 + rnd(0, .1), .2, .6).toFixed(2), boost: +(1.3 + rnd(0, .3)).toFixed(2), weeks: 52 };
  }

  /* =====================================================================
     Navigation & rendering
     ===================================================================== */
  let tab = 'home';
  let stack = [];        // pushed screens [{name, p}]
  let draft = null;      // form state for create screens
  let after = [];
  const app = $('#app');

  function go(name, p = {}) { stack.push({ name, p }); draft = null; render(true); }
  function back() { stack.pop(); draft = null; render(true); }
  function setTab(t) { tab = t; stack = []; draft = null; render(true); }
  document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.t)));

  const IC = {
    back: '<svg viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 4 12h5v9h6v-9h5z"/></svg>',
    right: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M21 12 12 4v5H3v6h9v5z"/></svg>',
    larr: '<svg viewBox="0 0 26 20" fill="#5d646c"><path d="M1 10 11 1v6h14v6H11v6z"/></svg>',
    rarr: '<svg viewBox="0 0 26 20" fill="#5d646c"><path d="M25 10 15 1v6H1v6h14v6z"/></svg>',
    plus: '<svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
    lock: '<svg viewBox="0 0 22 26" fill="#5d646c"><path d="M5 11V7a6 6 0 0 1 12 0v4h1.5A2.5 2.5 0 0 1 21 13.5v9a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 1 22.5v-9A2.5 2.5 0 0 1 3.5 11zm3 0h6V7a3 3 0 0 0-6 0z"/></svg>',
    x: '<svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 2l12 12M14 2 2 14" stroke="#111" stroke-width="2" stroke-linecap="round"/></svg>',
    lockSmall: '<svg viewBox="0 0 22 26" width="16" height="18" fill="#9aa0a6"><path d="M5 11V7a6 6 0 0 1 12 0v4h1.5A2.5 2.5 0 0 1 21 13.5v9a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 1 22.5v-9A2.5 2.5 0 0 1 3.5 11zm3 0h6V7a3 3 0 0 0-6 0z"/></svg>',
  };

  function topBar() {
    const d = dateObj();
    return `<div class="top">
      <div class="money">${euro(S.cash)}<br><span class="en">⚡${S.energy} | ${maxEnergy()}</span></div>
      <div class="date">${MONTHS[d.getUTCMonth()]}<small>${d.getUTCDate()}, ${d.getUTCFullYear()}</small></div>
      <button class="endweek" data-a="endweek">END WEEK</button>
    </div>`;
  }
  function pTitle(title, { energy = false, norm = false, extra = '' } = {}) {
    return `<div class="ptitle"><button class="back" data-a="back">${IC.back}</button>${energy ? `<span class="en">⚡ ${S.energy}</span>` : ''}<h1 class="${norm ? 'norm' : ''}">${esc(title)}</h1>${extra}</div>`;
  }

  function render(scrollTop) {
    if (!S) { renderStart(); return; }
    const top = stack[stack.length - 1];
    $('#tabs').hidden = !!(top && top.name === 'inbox');
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
    app.classList.toggle('push', !!top);
    app.innerHTML = top ? (SCREENS[top.name] || (() => ''))(top.p) : topBar() + TABS[tab]();
    if (scrollTop) window.scrollTo(0, 0);
    after.forEach((f) => f()); after = [];
  }

  /* ---------- start ---------- */
  function renderStart() {
    $('#tabs').hidden = true;
    app.classList.add('push');
    app.innerHTML = `<div class="start">
      <h1>Rap<br>Star<br><span style="color:#565d65">Sim</span></h1>
      <p>Schreib Songs, bau dein Studio aus, sammel Streams und Fans, spiel Festivals und werd zur Legende. Jede Woche zählt – drück <b>END WEEK</b>, um sie abzuschließen.</p>
      <div class="sub" style="text-align:left;margin-top:30px">Dein Künstlername</div>
      <div class="inp"><input id="startName" maxlength="24" placeholder="z. B. Run It Up" value="Run It Up"></div>
      <button class="big-btn c-green" data-a="start" style="margin-top:22px">Karriere starten</button>
      <button class="big-btn c-gray" data-a="startRich">Reich starten (wie im Video)</button>
      <p class="note" style="text-align:center">Gespeichert wird automatisch auf diesem Handy.</p>
    </div>`;
  }

  /* =====================================================================
     Tabs
     ===================================================================== */
  const TABS = {
    home() {
      const f = fameScore();
      const unread = S.inbox.filter((m) => !m.read).length;
      const h = S.history;
      const delta = S.listeners - h[0];
      return `
      <div class="fame"><b>FAME | ${grade(f)}</b><div class="track"><i style="width:${Math.max(4, f)}%"></i></div></div>
      <div class="platforms">
        <button class="plat" data-a="plat" data-p="sp" aria-label="Streaming-Profil" style="background:#1fbf5c"><svg viewBox="0 0 28 28" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M7 11v6M11.5 8v12M16 10v8M20.5 12.5v3"/></svg></button>
        <button class="plat" data-a="plat" data-p="am" aria-label="Musik-Profil" style="background:#fb2c48"><svg viewBox="0 0 28 28" fill="#fff"><path d="M20 4v14.5a3.5 3.5 0 1 1-2.2-3.25V9.2L11 10.6v9.9a3.5 3.5 0 1 1-2.2-3.25V6.5z"/></svg></button>
        <button class="plat" data-a="plat" data-p="bs" aria-label="Video-Profil" style="background:#0b0b0b;box-shadow:0 0 0 1px #333"><svg viewBox="0 0 28 28" fill="#fff"><path d="M10 7l12 7-12 7z"/></svg></button>
      </div>
      <div class="listeners"><span class="plus" style="color:${delta < 0 ? 'var(--salmon)' : 'var(--cash)'}">${delta >= 0 ? '+' : ''}${de(delta)}</span> Listeners<small>LAST 12 MONTHS</small></div>
      ${chartSvg(h)}
      <button class="pill" data-a="go" data-s="inbox">Inbox <span class="cnt">(${unread})</span></button>
      <button class="pill" data-a="go" data-s="relationship">Relationship</button>
      <button class="pill" data-a="go" data-s="social">Social</button>
      <button class="pill" data-a="go" data-s="trends">Trends</button>
      <button class="pill" data-a="go" data-s="label">Record Label</button>`;
    },

    talent() {
      const lockedBiz = fameScore() < BUSINESS_FAME;
      const row = ([k, label], locked) => {
        const v = S.talents[k];
        const isStudio = k === 'studio';
        const cost = v + 1;
        const btn = locked
          ? `<button class="up" disabled>${IC.lockSmall}</button>`
          : isStudio
            ? `<button class="up orange" data-a="go" data-s="studio">${IC.right}</button>`
            : `<button class="up" data-a="train" data-k="${k}" ${v >= 100 ? 'disabled' : ''}>${IC.up}</button>`;
        return `<div class="trow ${locked ? 'locked' : ''}">
          <div class="lv"><b>${v}</b>${isStudio || v >= 100 ? '' : `<small>${cost} <span class="bolt">⚡</span></small>`}</div>
          <div class="mid"><span>${label}</span><i><em style="width:${v}%"></em></i></div>${btn}</div>`;
      };
      return `<div class="title"><span class="dim">${talentTotal()}</span> Talent</div>
        ${TALENTS.map((t) => row(t, false)).join('')}
        <div class="section">${lockedBiz ? IC.lock : ''} Business</div>
        ${lockedBiz ? `<p class="note" style="margin:-6px 0 14px">Wird mit Fame ${GRADES[Math.ceil(BUSINESS_FAME / (100 / GRADES.length))]} freigeschaltet.</p>` : ''}
        ${BUSINESS.map((t) => row(t, lockedBiz)).join('')}
        <p class="note">Leadership: +1 max. Energie pro Level · Marketing: mehr Streams · Negotiation: bessere Gagen & Deals.</p>`;
    },

    music() {
      const songs = S.songs.slice().sort((a, b) => b.streams - a.streams).slice(0, 3);
      const albums = albumStats().slice(0, 3);
      return `<div class="title"><span class="dim">${compact(totalListens())}</span> Listens</div>
        <div class="listhead"><span>Most popular songs</span><button class="chip c-orange" data-a="go" data-s="newSong">New Song</button></div>
        <div class="toplist">${songs.length ? songs.map((s, i) => `<div><small>${i + 1}</small>${esc(s.title)}<em>, ${compact(s.streams)}</em></div>`).join('') : '<p class="empty">Noch keine Songs. Tipp auf NEW SONG.</p>'}</div>
        <div class="listhead"><span>Most popular albums</span><button class="chip c-orange" data-a="go" data-s="newAlbum">New Album</button></div>
        <div class="toplist">${albums.length ? albums.map((a, i) => `<div><small>${i + 1}</small>${esc(a.album.name)}<em>, ${compact(a.streams)}</em></div>`).join('') : '<p class="empty">Noch keine Alben.</p>'}</div>
        <div class="row2"><button class="chip c-olive" data-a="go" data-s="awards" style="width:134px">Awards</button><button class="chip c-teal" data-a="go" data-s="songboard" style="width:134px">Songboard</button></div>
        ${[['songs', 'Songs'], ['albums', 'Albums'], ['artists', 'Artists'], ['label', 'Contract'], ['festivals', 'Festival'], ['tour', 'Tour'], ['videoPick', 'Video']].map(([s, l]) => `<button class="pill" data-a="go" data-s="${s}">${l}</button>`).join('')}`;
    },

    money() {
      const li = S.lastIncome;
      const e = S.earnings;
      return `<div class="title"><span class="dim">$</span> Money</div>
        <div class="earn"><small>CASH</small><b style="color:var(--cash)">${euro(S.cash)}</b></div>
        <div class="h3">Letzte Woche</div>
        <div class="kv"><span>Streams</span><span>${de(li.streamsCount || 0)}</span></div>
        <div class="kv"><span>Streaming-Einnahmen</span><span>${euro(li.streams || 0)}</span></div>
        ${S.label ? `<div class="kv"><span>Anteil ${esc(S.label.name)}</span><span style="color:var(--salmon)">−${euro(li.label || 0)}</span></div>` : ''}
        <div class="h3">Karriere gesamt</div>
        <div class="kv"><span>Streaming</span><span>${euro(e.streams)}</span></div>
        <div class="kv"><span>Festivals</span><span>${euro(e.festivals)}</span></div>
        <div class="kv"><span>Touren</span><span>${euro(e.tours)}</span></div>
        <div class="kv"><span>Nebenjobs</span><span>${euro(e.jobs)}</span></div>
        <div class="h3">Nebenjob</div>
        <p class="note">Kellnern, Lager, Merch-Stand – bringt Geld für die ersten Studio-Sessions.</p>
        <button class="big-btn c-green" data-a="job" ${S.energy < 20 ? 'disabled' : ''}>Schicht arbeiten · 20 ⚡ · +${euro(jobPay())}</button>`;
    },

    settings() {
      return `<div class="title">Settings</div>
        <div class="sub" style="text-align:left">Künstlername</div>
        <div class="inp"><input id="setName" maxlength="24" value="${esc(S.name)}"><button data-a="rename" aria-label="Speichern">${IC.plus}</button></div>
        <div class="h3">Spielstand</div>
        <div class="kv"><span>Woche</span><span>${S.week}</span></div>
        <div class="kv"><span>Songs / Alben</span><span>${S.songs.length} / ${S.albums.length}</span></div>
        <div class="kv"><span>Follower</span><span>${de(S.followers)}</span></div>
        <button class="big-btn c-salmon" data-a="reset" style="margin-top:26px">Neues Spiel</button>
        <button class="big-btn c-gray" data-a="resetRich">Neu starten: reich (wie im Video)</button>
        <p class="note" style="text-align:center">Der Spielstand wird automatisch auf diesem Handy gespeichert.</p>`;
    },
  };

  function chartSvg(h) {
    const W = 340, H = 200;
    let lo = Math.min(...h), hi = Math.max(...h);
    if (hi - lo < 10) hi = lo + 10;
    const pad = (hi - lo) * .15; lo = Math.max(0, lo - pad); hi += pad;
    const n = Math.max(2, h.length);
    const pts = h.map((v, i) => [56 + (i / (n - 1)) * (W - 60), H - 10 - ((v - lo) / (hi - lo)) * (H - 20)]);
    if (h.length === 1) pts.push([W - 4, pts[0][1]]);
    const ticks = [0, 1, 2, 3].map((i) => lo + ((hi - lo) * (3 - i)) / 3);
    return `<div class="chart">
      ${ticks.map((t, i) => `<span class="yl" style="top:${4 + i * 60}px">${de(t)}</span>`).join('')}
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="#e9963f" stroke-width="2.2" stroke-linejoin="round" points="${pts.map((p) => p.join(',')).join(' ')}"/>
      ${pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="#e9963f"/>`).join('')}</svg></div>`;
  }
  function albumStats() {
    return S.albums.map((a) => ({ album: a, streams: S.songs.filter((s) => s.albumId === a.id).reduce((x, s) => x + s.streams, 0) })).sort((p, q) => q.streams - p.streams);
  }
  const jobPay = () => 300 + S.week * 4;

  /* =====================================================================
     Pushed screens
     ===================================================================== */
  const SCREENS = {
    inbox() {
      after.push(() => { S.inbox.forEach((m) => { m.read = true; }); save(); });
      const tagColor = { FEATURE: 'c-orange', FESTIVAL: 'c-orange', FAN: 'c-teal', LABEL: 'c-green' };
      return `<div class="inbox"><div class="wrap">
        <div class="hd"><button data-a="back">${IC.x}</button><h1>INBOX</h1></div>
        <p class="intro">Check your inbox for new emails regarding feature requests, endorsements and career opportunities.</p>
        <div class="lbl">MESSAGES</div>
        ${S.inbox.length ? S.inbox.map((m) => `<div class="msg ${m.read ? '' : 'unread'} ${m.done ? 'done' : ''}">
          <div class="mh"><div><b>${esc(m.from)}</b><small>${dateShort(m.date)}</small></div>
          <button class="chip ${tagColor[m.tag] || 'c-teal'}" data-a="mail" data-id="${m.id}">${m.done ? 'DONE' : m.tag}</button></div>
          <div class="subj">${esc(m.subj)}</div><div class="body">${esc(m.body)}</div></div>`).join('') : '<p class="intro">Noch keine Nachrichten.</p>'}
      </div></div>`;
    },

    newSong(p) {
      if (!draft) draft = { title: p.title || '', album: 0, artistry: 0, writing: 0, studio: 0, feat: p.feat || null, genre: S.trend, freeFeat: !!p.feat, mailId: p.mailId || null };
      const albums = [null, ...S.albums];
      const al = albums[draft.album];
      const roleSel = (role, label) => {
        const h = HIRES[role][draft[role]];
        const name = h[0] || (role === 'studio' ? 'My Studio' : S.name);
        const sk = h[0] ? h[1] : selfSkill[role]();
        return selector(label, name, `<span class="sk ${sk < 30 ? 'low' : ''}">${sk}</span> | ${euro(h[2])}`, role);
      };
      const featNpc = draft.feat ? S.npcs.find((n) => n.name === draft.feat) : null;
      const cost = songCost();
      return pTitle('New Song', { energy: true }) + `
        <div class="sub">Song name</div>
        <div class="inp"><input id="songTitle" maxlength="40" placeholder="Enter a song title" value="${esc(draft.title)}"><button data-a="randTitle" aria-label="Zufallstitel">${IC.plus}</button></div>
        ${selector('Assign album', al ? al.name : 'Single', '', 'album')}
        ${roleSel('artistry', 'Artistry')}
        ${roleSel('writing', 'Writing')}
        ${roleSel('studio', 'Studio')}
        ${selector('Feature', featNpc ? featNpc.name : 'None', featNpc ? `${compact(featNpc.listeners)} listeners | ${draft.freeFeat ? 'free' : euro(featureCost(featNpc))}` : '', 'feat')}
        <div class="total"><span>TOTAL COST</span><b>${euro(cost)}</b></div>
        <div class="row2 genre"><button class="chip c-salmon ${draft.genre === 'TRAP' ? 'on' : ''}" data-a="genre" data-g="TRAP">Trap</button><button class="chip c-green ${draft.genre === 'CLEAN' ? 'on' : ''}" data-a="genre" data-g="CLEAN">Clean</button></div>
        <button class="big-btn c-teal" data-a="createSong" ${S.energy < 10 || S.cash < cost ? 'disabled' : ''}>Create 10 <span class="bolt">⚡</span></button>
        <div class="avail">Cash available: ${euro(S.cash)}${S.energy < 10 ? ' · zu wenig Energie' : ''}</div>
        <p class="note" style="margin-top:16px">Trend gerade: <b>${S.trend}</b> (+10 % Streams). Die Qualität hängt von den Skills der Leute ab – wer „${esc(S.name)}“ bzw. „My Studio“ wählt, nutzt deine eigenen Talente.</p>`;
    },

    newAlbum() {
      if (!draft) draft = { name: '', cover: COVERS[0] };
      return pTitle('New Album') + `
        <div class="bigcover" style="background:${coverCss(draft.cover)};background-size:cover;background-position:center"></div>
        <div class="sub">Album name</div>
        <div class="inp"><input id="albumName" maxlength="40" placeholder="Enter an album name" value="${esc(draft.name)}"><button data-a="createAlbum" aria-label="Erstellen">${IC.plus}</button></div>
        <div class="sub">Choose a cover</div>
        <div class="covers">${COVERS.slice(0, 4).map((c, i) => `<button class="${draft.cover === c ? 'on' : ''}" data-a="cover" data-i="${i}" style="background:${c}"></button>`).join('')}</div>
        <button class="big-btn c-teal" data-a="createAlbum">Create</button>
        <button class="big-btn c-green" data-a="uploadCover">Upload your own</button>`;
    },

    songs() {
      const list = S.songs.slice().reverse();
      return pTitle('Songs') + (list.length ? list.map((s) => songRow(s)).join('') : '<p class="note">Noch keine Songs.</p>');
    },

    song(p) {
      const s = S.songs.find((x) => x.id === p.id); if (!s) return pTitle('Song');
      const units = Math.round(s.streams / 150);
      const cert = certOf(units);
      const al = songAlbum(s);
      const released = S.week - s.week >= 1;
      const w = s.weekly.slice(-20); const mx = Math.max(1, ...w);
      return pTitle(s.title, { norm: true, extra: `<div class="sd-cov" style="background:${coverCss(songCover(s))};background-size:cover;background-position:center"></div>` }) + `
        <p class="sd-desc">${released ? `"${esc(s.title)}" debuted with ${compact(s.debut || 0)} streams, generating ${euroK((s.debut || 0) * .004 * labelShare())} in its first week. 1 unit is equivalent to 150 streams.` : `"${esc(s.title)}" erscheint mit der nächsten Woche. Drück END WEEK.`}
        <br>${al ? `Album: ${esc(al.name)} · ` : 'Single · '}${s.genre}${s.feat ? ` · feat. ${esc(s.feat)}` : ''} · Qualität ${s.quality}</p>
        <div class="cert"><div class="disc" style="background:${cert.color}">♪</div><div class="r"><small>${cert.label}</small><b>${compact(units)} UNITS</b></div></div>
        <div class="stats2"><div><small>TOTAL STREAMS</small><b>${compact(s.streams)}</b></div><div><small>TOTAL REVENUE</small><b>${euroK(s.revenue)}</b></div></div>
        <div class="bars">${w.map((v) => `<i style="height:${Math.max(3, (v / mx) * 100)}%"></i>`).join('')}</div>
        ${s.video ? `<div class="card"><b>Music Video · ${esc(s.video.style)}</b><p>Directed by ${esc(s.video.director)} · +${Math.round(s.video.bonus * 100)} % Streams</p></div>` : `<button class="pill" data-a="go" data-s="newVideo" data-id="${s.id}">Music Video</button>`}`;
    },

    albums() {
      const st = albumStats();
      return pTitle('Albums') + (st.length ? st.map(({ album, streams }) => `<button class="srow" data-a="go" data-s="album" data-id="${album.id}">
          <div class="cov" style="background:${coverCss(album.cover)};background-size:cover;background-position:center"></div>
          <div class="info"><b>${esc(album.name)}</b><small>${S.songs.filter((s) => s.albumId === album.id).length} Songs • ${de(streams)} streams</small></div></button>`).join('')
        : '<p class="note">Noch keine Alben.</p>') + '<button class="big-btn c-orange" data-a="go" data-s="newAlbum">New Album</button>';
    },

    album(p) {
      const a = S.albums.find((x) => x.id === p.id); if (!a) return pTitle('Album');
      const songs = S.songs.filter((s) => s.albumId === a.id);
      return pTitle(a.name, { norm: true }) + `<div class="bigcover" style="width:180px;height:180px;background:${coverCss(a.cover)};background-size:cover;background-position:center"></div>
        <div class="stats2"><div><small>TOTAL STREAMS</small><b>${compact(songs.reduce((x, s) => x + s.streams, 0))}</b></div><div><small>SONGS</small><b>${songs.length}</b></div></div>
        ${songs.length ? songs.map((s) => songRow(s)).join('') : '<p class="note">Noch keine Songs auf diesem Album. Wähle es bei NEW SONG unter „Assign album“ aus.</p>'}`;
    },

    videoPick() {
      const list = S.songs.filter((s) => !s.video).slice().reverse();
      return pTitle('Video') + `<p class="note">Wähle einen Song für das Musikvideo.</p>` + (list.length ? list.map((s) => songRow(s, 'newVideo')).join('') : '<p class="note">Alle Songs haben schon ein Video – oder du hast noch keine.</p>');
    },

    newVideo(p) {
      const s = S.songs.find((x) => x.id === p.id); if (!s) return pTitle('New Video');
      if (!draft) draft = { dir: 0, style: 0 };
      const d = DIRECTORS[draft.dir], st = STYLES[draft.style];
      const dirSkill = d[0] ? d[1] : selfSkill.video();
      const cost = d[2] + st[1];
      return pTitle('New Video', { energy: true }) + `
        <div class="sub">Video name</div><div style="text-align:center;font-size:17px">${esc(s.title)} <span style="color:var(--orange)">(${s.quality})</span></div>
        ${selector('Director', `Directed by ${d[0] || S.name}`, `<span class="sk ${dirSkill < 50 ? 'low' : ''}">${dirSkill}</span> | ${euro(d[2])}`, 'dir')}
        ${selector('Style', st[0], euro(st[1]), 'style')}
        <div class="sub">Description</div>
        <p style="margin:0 0 4px;font-size:13px;font-weight:700">${st[2] ? `+${Math.round(st[2] * 100)} % BONUS` : 'NO BONUS'}</p>
        <p class="note" style="margin:0;font-size:11px">${st[3]}</p>
        <div class="total"><span>TOTAL COST</span><b>${euro(cost)}</b></div>
        <button class="big-btn c-teal" data-a="produce" data-id="${s.id}" ${S.energy < 10 || S.cash < cost ? 'disabled' : ''}>Produce 10 <span class="bolt">⚡</span></button>
        <div class="avail">Cash available: ${euro(S.cash)}</div>`;
    },

    studio() {
      const lv = S.talents.studio, c = studioCost();
      return pTitle('Studio') + `<div class="title" style="text-align:center;margin-top:20px"><span class="dim">LV</span> ${lv}</div>
        <p class="note" style="text-align:center">Dein eigenes Studio. Wenn du bei NEW SONG „My Studio“ nimmst, zählt dieses Level als Studio-Qualität – kostenlos.</p>
        ${lv < 100 ? `<button class="big-btn c-orange" data-a="studioUp" ${S.cash < c ? 'disabled' : ''}>Upgrade · ${euro(c)}</button>
        <button class="big-btn c-gray" data-a="studioUp10" ${S.cash < studioCost(10) ? 'disabled' : ''}>+10 Level · ${euro(studioCost(10))}</button>` : '<p style="text-align:center">Maximales Level erreicht.</p>'}
        <div class="avail" style="margin-top:8px">Cash available: ${euro(S.cash)}</div>`;
    },

    festivals() {
      const invites = S.inbox.filter((m) => m.action && m.action.type === 'festival' && !m.done);
      const past = S.festivals.slice().reverse();
      return pTitle('Festivals') + `<div class="earn"><small>EARNINGS</small><b>${euro(S.earnings.festivals)}</b></div>
        <div class="h3">Upcoming</div>
        ${invites.length ? invites.map((m) => `<div class="lrow"><div><small>${esc(m.action.place)} • ${de(m.action.attended)} Attended</small><b>${esc(m.action.name)} ${year()}</b></div><button class="chip c-pink" data-a="go" data-s="festivalReview" data-id="${m.id}">Review</button></div>`).join('') : '<p class="note">Keine Einladungen. Mit mehr Fame melden sich Festivals in deiner Inbox.</p>'}
        ${past.length ? `<div class="h3">Gespielt</div>${past.map((f) => `<div class="lrow"><div><small>${esc(f.place)}</small><b>${esc(f.name)} ${f.year}</b></div><span>${euro(f.fee)}</span></div>`).join('')}` : ''}`;
    },

    festivalReview(p) {
      const m = S.inbox.find((x) => x.id === p.id); if (!m) return pTitle('Festival');
      const a = m.action;
      return pTitle(a.name, { norm: true }) + `<p class="note">${esc(a.place)}</p>
        <div class="kv"><span>Besucher</span><span>${de(a.attended)}</span></div>
        <div class="kv"><span>Gage</span><span style="color:var(--cash)">${euro(a.fee)}</span></div>
        <div class="kv"><span>Energie</span><span>25 ⚡</span></div>
        <div class="kv"><span>Neue Hörer (ca.)</span><span>+${de(festivalFans(a))}</span></div>
        <button class="big-btn c-green" data-a="festAccept" data-id="${m.id}" ${S.energy < 25 ? 'disabled' : ''}>Annehmen & auftreten</button>
        <button class="big-btn c-salmon" data-a="festDecline" data-id="${m.id}">Absagen</button>`;
    },

    tour() {
      const f = fameScore();
      const cd = S.week - S.lastTour;
      return pTitle('Tour') + `<p class="note">Eine Tour kostet Vorab-Produktion und bringt Ticketeinnahmen plus neue Fans. Danach brauchst du 6 Wochen Pause.${cd < 6 ? ` <b>Noch ${6 - cd} Woche(n) Pause.</b>` : ''}</p>
        ${TOURS.map((t, i) => {
          const ok = f >= t.fame && cd >= 6 && S.energy >= t.energy && S.cash >= t.cost;
          return `<div class="card"><b>${t.name}</b> <span class="note">· ${t.shows} Shows · ab Fame ${grade(t.fame)}</span>
            <p>Kosten ${euro(t.cost)} · ${t.energy} ⚡ · Ticket ${t.price} € · erwartet ca. ${euro(tourEstimate(t))} Umsatz</p>
            <button class="big-btn c-orange" data-a="tour" data-i="${i}" ${ok ? '' : 'disabled'} style="margin-bottom:0">${f < t.fame ? 'Zu wenig Fame' : 'Tour starten'}</button></div>`;
        }).join('')}`;
    },

    social() {
      return pTitle('Social') + `<div class="stats2"><div><small>FOLLOWERS</small><b>${compact(S.followers)}</b></div><div><small>FAME</small><b>${grade()}</b></div></div>
        <button class="big-btn c-orange" data-a="post" ${S.energy < 5 ? 'disabled' : ''}>Post · 5 ⚡</button>
        <p class="note">Mehr Charisma und Virality = mehr neue Follower pro Post. Follower hören deine Songs.</p>
        ${S.posts.slice(0, 8).map((p) => `<div class="card"><b>@${esc(S.name.replace(/\s+/g, '').toLowerCase())}</b><p>${esc(p.text)}</p><p>♥ ${compact(p.likes)} · +${compact(p.gain)} Follower · ${dateShort(p.date)}</p></div>`).join('')}`;
    },

    trends() {
      return pTitle('Trends') + `<div class="card"><b>Angesagt: ${S.trend}</b><p>${S.trend === 'TRAP' ? 'Harte 808s und Ad-libs dominieren die Playlists.' : 'Cleane Hooks und Radio-Sound laufen gerade überall.'} Songs in diesem Stil bekommen +10 % Streams und etwas höhere Qualität.</p><p>Wechselt in ca. ${S.trendWeeks} Woche(n).</p></div>
        <div class="h3">Top-Artists diese Woche</div>
        ${S.npcs.slice().sort((a, b) => b.listeners - a.listeners).slice(0, 5).map((n, i) => `<div class="kv"><span>${i + 1}. ${esc(n.name)} – ${esc(n.hit)}</span><span>${compact(n.listeners)}</span></div>`).join('')}`;
    },

    relationship() {
      const pt = S.partner;
      return pTitle('Relationship') + (pt ? `<div class="card"><b>❤ ${esc(pt.name)}</b><p>Liebe: ${pt.love}/100${pt.public ? ' · öffentlich' : ''}</p>
          <div style="height:10px;border-radius:5px;background:#5c636b;margin-top:10px;overflow:hidden"><div style="height:100%;width:${pt.love}%;background:var(--salmon)"></div></div></div>
          <button class="big-btn c-salmon" data-a="date" ${S.energy < 5 || S.cash < 200 ? 'disabled' : ''}>Date · 5 ⚡ · 200 €</button>
          ${!pt.public ? `<button class="big-btn c-orange" data-a="goPublic" ${pt.love < 60 ? 'disabled' : ''}>Beziehung öffentlich machen${pt.love < 60 ? ' (ab 60 Liebe)' : ''}</button>` : ''}
          <button class="big-btn c-gray" data-a="breakup">Schluss machen</button>`
        : `<p class="note">Du bist gerade Single.</p><button class="big-btn c-salmon" data-a="meet" ${S.energy < 10 ? 'disabled' : ''}>Jemanden kennenlernen · 10 ⚡</button>`)
        + '<p class="note">Die Liebe sinkt jede Woche ein bisschen – vergiss die Dates nicht. Eine öffentliche Beziehung bringt Follower.</p>';
    },

    label() {
      const offers = S.inbox.filter((m) => m.action && m.action.type === 'label' && !m.done);
      const l = S.label;
      return pTitle('Contract') + (l ? `<div class="card"><b>${esc(l.name)}</b>
          <p>Vorschuss erhalten: ${euro(l.advance)}<br>Du behältst: ${Math.round(l.keep * 100)} % der Streaming-Einnahmen<br>Promo: +${Math.round((l.boost - 1) * 100)} % Streams<br>${l.weeksLeft > 0 ? `Laufzeit: noch ${l.weeksLeft} Woche(n)` : 'Laufzeit abgelaufen'}</p></div>
          <button class="big-btn c-salmon" data-a="leaveLabel" ${l.weeksLeft > 0 ? 'disabled' : ''}>Vertrag kündigen${l.weeksLeft > 0 ? ' (nach Laufzeit)' : ''}</button>`
        : `<div class="card"><b>Independent</b><p>Du bist bei keinem Label. Du behältst 100 % deiner Einnahmen, bekommst aber keine Promo. Ab Fame ${grade(30)} melden sich Labels in deiner Inbox.</p></div>`)
        + (offers.length && !l ? `<div class="h3">Angebote</div>${offers.map((m) => { const o = m.action.offer; return `<div class="card"><b>${esc(o.name)}</b><p>${euro(o.advance)} Vorschuss · du behältst ${Math.round(o.keep * 100)} % · +${Math.round((o.boost - 1) * 100)} % Streams · ${o.weeks} Wochen</p><button class="big-btn c-green" data-a="signLabel" data-id="${m.id}" style="margin-bottom:0">Unterschreiben</button></div>`; }).join('')}` : '');
    },

    artists() {
      return pTitle('Artists') + S.npcs.slice().sort((a, b) => b.listeners - a.listeners).map((n) => `<div class="srow"><div class="info"><b>${esc(n.name)}</b><small>${de(n.listeners)} listeners · Feature ${euro(featureCost(n))}</small></div><div class="q" style="font-size:18px">${grade(clamp(Math.round(Math.log10(n.listeners + 1) / 7.9 * 100), 0, 100))}</div></div>`).join('');
    },

    songboard() {
      const rows = S.npcs.map((n) => ({ t: n.hit, a: n.name, v: Math.round(n.listeners * .35 * (.8 + (Math.abs(hash(n.hit + S.week)) % 40) / 100)), me: false }))
        .concat(S.songs.filter((s) => s.weekly.length).map((s) => ({ t: s.title, a: S.name, v: s.weekly[s.weekly.length - 1], me: true })))
        .sort((a, b) => b.v - a.v).slice(0, 20);
      return pTitle('Songboard') + `<p class="note">Die meistgestreamten Songs der letzten Woche.</p>` + rows.map((r, i) => `<div class="srow ${r.me ? 'hl' : ''}"><div class="q ${r.me ? 'me' : ''}" style="font-size:20px">${i + 1}</div><div class="info"><b>${esc(r.t)}</b><small>${esc(r.a)} • ${de(r.v)} streams</small></div></div>`).join('');
    },

    awards() {
      return pTitle('Awards') + `<p class="note">Die Awards werden jedes Jahr in der ersten Januarwoche verliehen. Kategorien: Song des Jahres, Album des Jahres, Newcomer des Jahres, Artist des Jahres.</p>`
        + (S.awards.length ? S.awards.slice().reverse().map((a) => `<div class="card"><b>🏆 ${esc(a.name)} ${a.year}</b><p>${esc(a.what)}</p></div>`).join('') : '<div class="card"><b>Noch keine Awards</b><p>Hau Hits raus und sammel Fame.</p></div>');
    },
  };

  function selector(label, value, subline, key) {
    return `<div class="sub" style="margin:10px 0 0">${label}</div><div class="sel">
      <button data-a="cyc" data-k="${key}" data-d="-1" aria-label="zurück">${IC.larr}</button>
      <div class="val"><b>${esc(value)}</b>${subline ? `<span>${subline}</span>` : ''}</div>
      <button data-a="cyc" data-k="${key}" data-d="1" aria-label="weiter">${IC.rarr}</button></div>`;
  }
  function songRow(s, target = 'song') {
    const al = songAlbum(s);
    const pending = S.week - s.week < 1;
    return `<button class="srow" data-a="go" data-s="${target}" data-id="${s.id}"><div class="info"><b>${esc(s.title)}</b><small>${al ? esc(al.name) : 'Single'} • ${pending ? 'erscheint nächste Woche' : de(s.streams) + ' streams'}</small></div><div class="q">${s.quality}</div></button>`;
  }
  function certOf(units) {
    if (units >= 1e7) return { label: `${Math.floor(units / 1e7)}X DIAMOND-CERTIFIED`, color: '#cfe8f2' };
    if (units >= 1e6) return { label: `${Math.floor(units / 1e6)}X PLATINUM-CERTIFIED`, color: '#d9d2a6' };
    if (units >= 5e5) return { label: 'GOLD-CERTIFIED', color: '#e6c25a' };
    return { label: 'NOT CERTIFIED', color: '#5c636b' };
  }
  const featureCost = (n) => Math.round(n.listeners * .02 / 100) * 100 + 500;
  function songCost() {
    const featNpc = draft.feat ? S.npcs.find((n) => n.name === draft.feat) : null;
    return HIRES.artistry[draft.artistry][2] + HIRES.writing[draft.writing][2] + HIRES.studio[draft.studio][2] + (featNpc && !draft.freeFeat ? featureCost(featNpc) : 0);
  }
  const studioCost = (n = 1) => { let c = 0; for (let i = 0; i < n && S.talents.studio + i < 100; i++) c += Math.round(300 * 1.07 ** (S.talents.studio + i)); return c; };
  const festivalFans = (a) => Math.round(a.attended * .03 * (1 + S.talents.charisma / 100));
  const TOURS = [
    { name: 'Club Tour', shows: 10, cap: 400, price: 30, cost: 3000, energy: 40, fame: 20 },
    { name: 'Theater Tour', shows: 18, cap: 2500, price: 55, cost: 40000, energy: 55, fame: 42 },
    { name: 'Arena Tour', shows: 24, cap: 14000, price: 85, cost: 400000, energy: 70, fame: 62 },
    { name: 'Stadium Tour', shows: 30, cap: 55000, price: 120, cost: 3000000, energy: 90, fame: 82 },
  ];
  const tourEstimate = (t) => Math.round(Math.min(t.cap, (S.listeners + S.followers) * .03 / t.shows) * t.shows * t.price);

  /* =====================================================================
     Actions
     ===================================================================== */
  const ACTIONS = {
    start() { newGame(($('#startName').value || '').trim() || 'Run It Up', false); render(true); },
    startRich() { newGame(($('#startName').value || '').trim() || 'Run It Up', true); render(true); },
    back,
    go(el) { go(el.dataset.s, el.dataset.id ? { id: el.dataset.id } : {}); },
    endweek() { endWeek(); },

    train(el) {
      const k = el.dataset.k, c = S.talents[k] + 1;
      if (S.energy < c) { toast(`Zu wenig Energie (${c} ⚡ nötig)`); shake(el); return; }
      S.energy -= c; S.talents[k] = Math.min(100, S.talents[k] + 1);
      save(); render();
    },
    studioUp() { const c = studioCost(); if (S.cash < c) return; S.cash -= c; S.talents.studio++; save(); render(); },
    studioUp10() { const c = studioCost(10); if (S.cash < c) return; S.cash -= c; S.talents.studio = Math.min(100, S.talents.studio + 10); save(); render(); },

    cyc(el) {
      const k = el.dataset.k, d = +el.dataset.d;
      const top = stack[stack.length - 1];
      if (top.name === 'newSong') {
        keepSongInput();
        if (k === 'album') draft.album = (draft.album + d + S.albums.length + 1) % (S.albums.length + 1);
        else if (k === 'feat') {
          const names = [null, ...S.npcs.map((n) => n.name)];
          const i = names.indexOf(draft.feat);
          draft.feat = names[(i + d + names.length) % names.length]; draft.freeFeat = false;
        } else draft[k] = (draft[k] + d + HIRES[k].length) % HIRES[k].length;
      } else if (top.name === 'newVideo') {
        if (k === 'dir') draft.dir = (draft.dir + d + DIRECTORS.length) % DIRECTORS.length;
        else draft.style = (draft.style + d + STYLES.length) % STYLES.length;
      }
      render();
    },
    genre(el) { keepSongInput(); draft.genre = el.dataset.g; render(); },
    randTitle() { draft.title = songName().toLowerCase(); render(); },
    createSong() {
      keepSongInput();
      const title = draft.title.trim();
      if (!title) { toast('Gib dem Song einen Namen'); $('#songTitle').focus(); return; }
      const featNpc = draft.feat ? S.npcs.find((n) => n.name === draft.feat) : null;
      const cost = songCost();
      if (S.energy < 10 || S.cash < cost) return;
      const sk = (role) => (HIRES[role][draft[role]][0] ? HIRES[role][draft[role]][1] : selfSkill[role]());
      let q = .36 * sk('artistry') + .36 * sk('writing') + .28 * sk('studio') + rnd(-5, 5) + (draft.genre === S.trend ? 4 : 0) + (featNpc ? 2 : 0);
      q = clamp(Math.round(q), 1, 100);
      S.energy -= 10; S.cash -= cost;
      const albums = [null, ...S.albums];
      const s = { id: uid(), title, albumId: albums[draft.album] ? albums[draft.album].id : null, quality: q, genre: draft.genre, feat: featNpc ? featNpc.name : null, week: S.week, streams: 0, revenue: 0, weekly: [], debut: 0, video: null };
      S.songs.push(s);
      if (draft.mailId) { const m = S.inbox.find((x) => x.id === draft.mailId); if (m) m.done = true; }
      save();
      stack.pop(); draft = null;
      go('song', { id: s.id });
      toast(`"${title}" aufgenommen – Qualität ${q}`);
    },

    cover(el) { keepAlbumInput(); draft.cover = COVERS[+el.dataset.i]; render(); },
    uploadCover() { keepAlbumInput(); pickImage(400).then((d) => { draft.cover = d; render(); }).catch(() => {}); },
    createAlbum() {
      keepAlbumInput();
      const name = draft.name.trim();
      if (!name) { toast('Gib dem Album einen Namen'); $('#albumName').focus(); return; }
      S.albums.push({ id: uid(), name, cover: draft.cover, week: S.week });
      save(); stack.pop(); draft = null; go('albums');
      toast(`Album „${name}“ erstellt – weise ihm bei NEW SONG Songs zu`);
    },

    produce(el) {
      const s = S.songs.find((x) => x.id === el.dataset.id);
      const d = DIRECTORS[draft.dir], st = STYLES[draft.style];
      const cost = d[2] + st[1];
      if (!s || S.energy < 10 || S.cash < cost) return;
      const skill = d[0] ? d[1] : selfSkill.video();
      const bonus = +(st[2] + skill / 400 + s.quality / 500).toFixed(2);
      S.energy -= 10; S.cash -= cost;
      s.video = { director: d[0] || S.name, style: st[0], bonus, week: S.week };
      save(); stack.pop(); draft = null;
      if (stack.length && stack[stack.length - 1].name === 'videoPick') stack.pop();
      go('song', { id: s.id });
      toast(`Video gedreht: +${Math.round(bonus * 100)} % Streams`);
    },

    mail(el) {
      const m = S.inbox.find((x) => x.id === el.dataset.id); if (!m || m.done) return;
      const a = m.action;
      if (!a) { m.done = true; save(); render(); return; }
      if (a.type === 'feature') go('newSong', { feat: a.npc, mailId: m.id, title: `${S.name.split(' ')[0].toLowerCase()} x ${a.npc.split(' ')[0].toLowerCase()}` });
      else if (a.type === 'festival') go('festivalReview', { id: m.id });
      else if (a.type === 'label') go('label');
    },

    festAccept(el) {
      const m = S.inbox.find((x) => x.id === el.dataset.id); if (!m || S.energy < 25) return;
      const a = m.action;
      S.energy -= 25; S.cash += a.fee; S.earnings.festivals += a.fee;
      const fans = festivalFans(a);
      S.followers += Math.round(fans * .6); S.listeners += fans;
      S.festivals.push({ name: a.name, place: a.place, fee: a.fee, year: year() });
      m.done = true; save(); back();
      toast(`${a.name}: +${euro(a.fee)}, +${de(fans)} Hörer`);
    },
    festDecline(el) { const m = S.inbox.find((x) => x.id === el.dataset.id); if (m) m.done = true; save(); back(); },

    tour(el) {
      const t = TOURS[+el.dataset.i];
      if (S.energy < t.energy || S.cash < t.cost) return;
      const sold = Math.round(Math.min(t.cap, (S.listeners + S.followers) * .03 / t.shows * rnd(.7, 1.15)));
      const rev = sold * t.shows * t.price;
      S.energy -= t.energy; S.cash += rev - t.cost; S.earnings.tours += rev - t.cost; S.lastTour = S.week;
      const fans = Math.round(sold * t.shows * .4);
      S.followers += fans; S.listeners += Math.round(fans * .5);
      save(); render();
      modal(`<h2>${t.name}</h2><p class="note">${t.shows} Shows, im Schnitt ${de(sold)} von ${de(t.cap)} Tickets verkauft.</p>
        <div class="kv"><span>Ticketumsatz</span><span>${euro(rev)}</span></div><div class="kv"><span>Produktion</span><span>−${euro(t.cost)}</span></div>
        <div class="kv"><span>Gewinn</span><span style="color:${rev - t.cost >= 0 ? 'var(--cash)' : 'var(--salmon)'}">${euro(rev - t.cost)}</span></div>
        <div class="kv"><span>Neue Fans</span><span>+${de(fans)}</span></div><button class="big-btn c-green" data-a="closeModal">Weiter</button>`);
    },

    post() {
      if (S.energy < 5) return;
      S.energy -= 5;
      const gain = Math.round((S.talents.charisma + S.talents.virality) * rnd(1, 4) + S.followers * rnd(.003, .015));
      S.followers += gain;
      const s = S.songs.length ? pick(S.songs).title : null;
      const text = pick([s ? `"${s}" läuft bei euch? 🔥` : 'Studio. Nacht. Keine Ausreden.', 'Danke für alles. Wir sind erst am Anfang.', 'Neue Musik kommt. Bald.', s ? `Wer hat "${s}" schon 10x gehört? 👀` : `Wer ist ready für Woche ${S.week + 1}?`, 'Mama, ich hab’s geschafft (fast).']);
      S.posts.unshift({ text, likes: Math.round(gain * rnd(3, 9) + S.followers * .02), gain, date: S.date });
      S.posts.length = Math.min(S.posts.length, 20);
      save(); render();
    },
    meet() {
      if (S.energy < 10) return; S.energy -= 10;
      S.partner = { name: pick(['Lea', 'Mila', 'Noah', 'Sofia', 'Elif', 'Jonas', 'Aylin', 'Kenji', 'Zoe', 'Luca']), love: rint(15, 30), public: false };
      save(); render(); toast(`Du hast ${S.partner.name} kennengelernt`);
    },
    date() { if (!S.partner || S.energy < 5 || S.cash < 200) return; S.energy -= 5; S.cash -= 200; S.partner.love = clamp(S.partner.love + rint(8, 18), 0, 100); save(); render(); },
    goPublic() { if (!S.partner) return; S.partner.public = true; const g = Math.round(S.followers * .08 + 200); S.followers += g; save(); render(); toast(`Beziehung öffentlich: +${de(g)} Follower`); },
    breakup() { if (!S.partner) return; const n = S.partner.name; S.partner = null; save(); render(); toast(`Du und ${n} geht getrennte Wege`); },
    signLabel(el) {
      const m = S.inbox.find((x) => x.id === el.dataset.id); if (!m || S.label) return;
      const o = m.action.offer;
      S.label = { ...o, weeksLeft: o.weeks }; S.cash += o.advance;
      S.inbox.forEach((x) => { if (x.action && x.action.type === 'label') x.done = true; });
      save(); render(); toast(`Bei ${o.name} unterschrieben: +${euro(o.advance)}`);
    },
    leaveLabel() { if (!S.label || S.label.weeksLeft > 0) return; const n = S.label.name; S.label = null; save(); render(); toast(`Vertrag mit ${n} beendet – du bist wieder independent`); },
    job() { if (S.energy < 20) return; S.energy -= 20; const p = jobPay(); S.cash += p; S.earnings.jobs += p; save(); render(); toast(`+${euro(p)}`); },
    rename() { const v = $('#setName').value.trim(); if (v) { S.name = v; save(); toast('Name gespeichert'); } },
    reset() { if (confirm('Wirklich neu anfangen? Dein Spielstand wird gelöscht.')) { S = null; try { localStorage.removeItem(KEY); } catch (e) {} tab = 'home'; stack = []; render(true); } },
    resetRich() { if (confirm('Neues Spiel mit reichem Start? Dein Spielstand wird gelöscht.')) { newGame(S.name, true); tab = 'home'; stack = []; render(true); } },
    plat(el) { const k = el.dataset.p; setTimeout(() => openPf(k), 120); },
    pfClose() { closePf(); },
    pfTab(el) { pfState.tab = el.dataset.t; refreshPf(); },
    pfToggle() { pfState.popular = !pfState.popular; refreshPf(); },
    pfFollow() { pfState.followed = !pfState.followed; refreshPf(); },
    pfPlay(el) { const id = el.dataset.id; if (!id) return; pfState.playing = pfState.playing === id ? null : id; refreshPf(); },
    pfBanner(el) {
      const k = el.dataset.p;
      pickImage(900, 1.4).then((d) => { S.banners = S.banners || {}; S.banners[k] = d; save(); refreshPf(); }).catch(() => {});
    },
    closeModal() { $('#modalBg').classList.remove('show'); render(); },
  };

  function keepSongInput() { const i = $('#songTitle'); if (i && draft) draft.title = i.value; }
  function keepAlbumInput() { const i = $('#albumName'); if (i && draft) draft.name = i.value; }

  app.addEventListener('click', handle);
  $('#modal').addEventListener('click', handle);
  $('#modalBg').addEventListener('click', (e) => { if (e.target.id === 'modalBg') ACTIONS.closeModal(); });
  function handle(e) {
    const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
    const f = ACTIONS[el.dataset.a]; if (f) f(el);
  }
  app.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'albumName') ACTIONS.createAlbum();
    else if (e.target.id === 'songTitle' || e.target.id === 'startName' || e.target.id === 'setName') e.target.blur();
  });

  /* ---------- platform pages (green / red / black icon on Home) ---------- */
  const PF_BANNER = {
    sp: 'radial-gradient(circle at 60% 12%,#2bd1c4 0 7%,transparent 7.5%), radial-gradient(circle at 48% 30%,#7d3cff 0 5%,transparent 5.5%), radial-gradient(circle at 56% 48%,#ff3b30 0 6%,transparent 6.5%), radial-gradient(circle at 44% 62%,#1b5cff 0 4%,transparent 4.5%), radial-gradient(circle at 60% 78%,#ff9500 0 5%,transparent 5.5%), radial-gradient(circle at 40% 90%,#34c759 0 3.5%,transparent 4%), radial-gradient(circle at 70% 64%,#ff2d92 0 3%,transparent 3.5%), radial-gradient(circle at 35% 40%,#ffd60a 0 2.5%,transparent 3%), #fff',
    am: 'radial-gradient(circle at 70% 30%,#ff5bd6 0%,#8b1fa8 35%,#2a0640 80%)',
    bs: 'linear-gradient(135deg,#1d1d2a 0%,#3a1c5c 50%,#0f0f12 100%)',
  };
  const PF_SHARE = { sp: .62, am: .24, bs: .14 };
  let pfState = { tab: 'music', popular: true, playing: null, followed: false };
  const yearAt = (w) => { const d = dateObj(); d.setUTCDate(d.getUTCDate() - (S.week - w) * 7); return d.getUTCFullYear(); };
  const bannerCss = (k) => (S.banners && S.banners[k] ? `url('${S.banners[k]}') center/cover` : PF_BANNER[k]);
  const camBtn = (k) => `<button class="cam" data-a="pfBanner" data-p="${k}" aria-label="Bild ändern"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>`;
  const downBtn = (dark) => `<button class="down" data-a="pfClose" aria-label="Schließen"><svg viewBox="0 0 14 9" fill="none" stroke="${dark ? '#000' : '#fff'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.5 7 7.5l6-6"/></svg></button>`;

  function pfHTML(k) {
    const released = S.songs.filter((x) => S.week - x.week >= 1);
    const byStreams = released.slice().sort((a, b) => b.streams - a.streams);
    const albums = albumStats();
    const latestAlbum = S.albums.slice().sort((a, b) => b.week - a.week)[0];
    if (k === 'sp') {
      const list = (pfState.popular ? byStreams : released.slice().reverse()).slice(0, 10);
      const ml = Math.round(S.listeners * PF_SHARE.sp);
      let body = '';
      if (pfState.tab === 'music') {
        body = `<h3>${pfState.popular ? 'Popular' : 'Latest'}<button class="tg ${pfState.popular ? 'on' : ''}" data-a="pfToggle" aria-label="Beliebt/Neu"></button></h3>
          ${list.length ? list.map((x, i) => `<div class="tr ${pfState.playing === x.id ? 'playing' : ''}" data-a="pfPlay" data-id="${x.id}"><span class="n">${i + 1}</span><i class="c" style="background:${coverCss(songCover(x))};background-size:cover;background-position:center"></i><div class="t"><b>${esc(x.title)}</b><small>${de(x.streams)}</small></div><span class="dots">•••</span></div>`).join('') : '<p class="empty">Noch keine veröffentlichten Songs.</p>'}
          <h3>Popular Releases</h3>
          ${albums.length ? albums.map(({ album, streams }) => `<div class="tr"><i class="c" style="background:${coverCss(album.cover)};background-size:cover;background-position:center"></i><div class="t"><b>${esc(album.name)}</b><small>${yearAt(album.week)} • ${de(streams / 1500)} albums sold</small></div></div>`).join('') : '<p class="empty">Noch keine Alben.</p>'}`;
      } else if (pfState.tab === 'events') {
        const inv = S.inbox.filter((m) => m.action && m.action.type === 'festival' && !m.done);
        const past = S.festivals.slice().reverse();
        body = `<h3>Events</h3>${inv.concat(past).length ? inv.map((m) => `<div class="tr"><div class="t"><b>${esc(m.action.name)}</b><small>${esc(m.action.place)} · angefragt</small></div></div>`).join('') + past.map((f) => `<div class="tr"><div class="t"><b>${esc(f.name)} ${f.year}</b><small>${esc(f.place)} · gespielt</small></div></div>`).join('') : '<p class="empty">Keine Events. Festivals melden sich in deiner Inbox.</p>'}`;
      } else {
        const top = byStreams[0];
        body = `<h3>Recap ${year()}</h3>
          <div class="tr"><div class="t"><b>${de(ml)}</b><small>Monthly listeners</small></div></div>
          <div class="tr"><div class="t"><b>${de(Math.round(totalListens() * PF_SHARE.sp))}</b><small>Streams auf dieser Plattform</small></div></div>
          <div class="tr"><div class="t"><b>${top ? esc(top.title) : '—'}</b><small>Meistgehörter Song</small></div></div>
          <div class="tr"><div class="t"><b>${de(S.followers)}</b><small>Follower</small></div></div>`;
      }
      return `<div class="wrap">
        <div class="banner" style="background:${bannerCss('sp')}">${downBtn(true)}${camBtn('sp')}</div>
        <div class="meta"><span>${compact(ml)} monthly listeners</span><span>0,004 €/stream</span></div>
        <div class="ctrl"><span class="ava"></span><button class="follow" data-a="pfFollow">${pfState.followed ? 'Following' : 'Follow'}</button>
          <span class="shuffle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#b3b3b3" stroke-width="2" stroke-linecap="round"><path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c2 0 3.5-1.6 4.8-3.6M21 7h-3c-2 0-3.5 1.6-4.8 3.6M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></span>
          <button class="play" data-a="pfPlay" data-id="${pfState.playing || (byStreams[0] || {}).id || ''}">${pfState.playing ? '<svg viewBox="0 0 24 24" fill="#000"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>' : '<svg viewBox="0 0 24 24" fill="#000"><path d="M7 4l14 8-14 8z"/></svg>'}</button></div>
        <div class="tabsx">${[['music', 'Music'], ['events', 'Events'], ['recap', 'Recap']].map(([t, l]) => `<button class="${pfState.tab === t ? 'on' : ''}" data-a="pfTab" data-t="${t}">${l}</button>`).join('')}</div>
        ${body}</div>`;
    }
    if (k === 'am') {
      const la = latestAlbum;
      return `<div class="wrap">
        <div class="banner" style="background:${bannerCss('am')}">${downBtn(false)}<span class="name">${esc(S.name)}</span>${camBtn('am')}</div>
        ${la ? `<div class="feat"><i class="c" style="background:${coverCss(la.cover)};background-size:cover;background-position:center"></i><div><small>FEATURED ALBUM</small><b>${esc(la.name)} (${yearAt(la.week)})</b><span class="pillr">See Artist View</span></div></div>` : '<div style="height:12px"></div>'}
        <h3>Top Songs <span>›</span></h3>
        ${byStreams.slice(0, 8).map((x) => { const al = songAlbum(x); return `<div class="tr"><b>${esc(x.title)}</b><small>${al ? esc(al.name) : 'Single'} • ${yearAt(x.week)}</small></div>`; }).join('') || '<div class="tr"><small>Noch keine veröffentlichten Songs.</small></div>'}
        <h3>Albums</h3>
        <div class="albums">${albums.map(({ album }) => `<div><i style="background:${coverCss(album.cover)};background-size:cover;background-position:center"></i><b>${esc(album.name)}</b><small>${yearAt(album.week)}</small></div>`).join('') || '<small style="color:#8a8a8e">Noch keine Alben.</small>'}</div></div>`;
    }
    const vids = S.songs.filter((x) => x.video);
    return `<div class="wrap">
      <div class="banner" style="height:200px;background:${bannerCss('bs')}">${downBtn(false)}${camBtn('bs')}</div>
      <div class="head"><b>${esc(S.name)}</b><small>${compact(S.followers * .6)} Abonnenten · ${vids.length} Videos</small></div>
      ${vids.length ? vids.slice().reverse().map((x) => `<div class="vid"><i style="background:${coverCss(songCover(x))};background-size:cover;background-position:center"></i><div><b>${esc(x.title)} (Official ${esc(x.video.style)} Video)</b><small>${compact(x.streams * .35)} Aufrufe · Regie: ${esc(x.video.director)}</small></div></div>`).join('')
        : '<p style="padding:0 18px;color:#aaa;font-size:14px">Noch keine Musikvideos. Dreh eins unter Musik → Video.</p>'}</div>`;
  }
  let pfOpen = null;
  function openPf(k) {
    pfOpen = k; pfState = { tab: 'music', popular: true, playing: null, followed: pfState.followed };
    const el = $('#pf');
    el.className = `pf ${k}`; el.innerHTML = pfHTML(k); el.scrollTop = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
  }
  function refreshPf() { if (pfOpen) { const el = $('#pf'); const y = el.scrollTop; el.innerHTML = pfHTML(pfOpen); el.scrollTop = y; } }
  function closePf() { pfOpen = null; $('#pf').classList.remove('open'); }
  $('#pf').addEventListener('click', handle);
  // swipe down from the top to close
  (() => {
    const el = $('#pf'); let y0 = null, dy = 0;
    el.addEventListener('touchstart', (e) => { y0 = el.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
    el.addEventListener('touchmove', (e) => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) { el.style.transition = 'none'; el.style.transform = `translateY(${dy}px)`; } }, { passive: true });
    el.addEventListener('touchend', () => { if (y0 == null) return; el.style.transition = ''; el.style.transform = ''; if (dy > 120) closePf(); y0 = null; });
  })();

  /* ---------- helpers ---------- */
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
  function shake(el) { el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 260 }); }
  function modal(html) { $('#modal').innerHTML = html; $('#modalBg').classList.add('show'); }
  function showReport(r, lBefore) {
    const d = dateObj();
    modal(`<h2>Woche ${S.week}</h2><p class="note">${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}</p>
      <div class="kv"><span>Streams</span><span>${de(r.streams)}</span></div>
      <div class="kv"><span>Einnahmen</span><span style="color:var(--cash)">+${euro(r.rev)}</span></div>
      ${r.labelCut ? `<div class="kv"><span>Label-Anteil</span><span style="color:var(--salmon)">−${euro(r.labelCut)}</span></div>` : ''}
      <div class="kv"><span>Monatliche Hörer</span><span>${de(S.listeners)} (${S.listeners - lBefore >= 0 ? '+' : ''}${de(S.listeners - lBefore)})</span></div>
      <div class="kv"><span>Energie</span><span>⚡ ${S.energy} aufgefüllt</span></div>
      ${r.events.map((x) => `<p style="margin:10px 0 0;font-size:14px">• ${esc(x)}</p>`).join('')}
      <button class="big-btn c-green" data-a="closeModal" style="margin-top:18px">Weiter</button>`);
  }
  function pickImage(max, ratio = 1) {
    return new Promise((resolve, reject) => {
      const inp = $('#file');
      inp.onchange = () => {
        const f = inp.files[0]; inp.value = ''; if (!f) return reject();
        const url = URL.createObjectURL(f); const img = new Image();
        img.onload = () => {
          let sw = img.naturalWidth, sh = sw / ratio;
          if (sh > img.naturalHeight) { sh = img.naturalHeight; sw = sh * ratio; }
          const cv = document.createElement('canvas'); cv.width = max; cv.height = Math.round(max / ratio);
          cv.getContext('2d').drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) / 2, sw, sh, 0, 0, cv.width, cv.height);
          URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg', .8));
        };
        img.onerror = () => { URL.revokeObjectURL(url); toast('Bild konnte nicht geladen werden'); reject(); };
        img.src = url;
      };
      inp.click();
    });
  }

  /* ---------- home-screen app viewport fix (bottom strip on iOS) ---------- */
  function fixViewport() {
    const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    const portraitH = Math.max(screen.height, screen.width);
    const gap = standalone && innerHeight < innerWidth * 3 ? Math.max(0, Math.min(80, portraitH - innerHeight)) : 0;
    document.documentElement.style.setProperty('--gap', gap + 'px');
  }
  fixViewport();
  addEventListener('orientationchange', () => setTimeout(fixViewport, 400));

  document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active press states on iOS
  load();
  render(true);
})();
</script>
</body>
</html>
